<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folga — quanto está livre este mês</title>
<meta name="description" content="Sua folga do mês em um número: quanto entra, quanto guardar, quanto está livre para gastar sem culpa. Your month's slack in one number.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --page: #f9f9f7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --good-text: #006300; --critical: #d03b3b; --warning: #fab219; --status-good: #0ca30c;
    --s1: #2a78d6; --s2: #008300; --s3: #e87ba4; --s4: #eda100;
    --s5: #1baf7a; --s6: #eb6834; --s7: #4a3aa7;
    --seq-track: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
      --border: rgba(255,255,255,0.10); --good-text: #0ca30c;
      --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500;
      --s5: #199e70; --s6: #d95926; --s7: #9085e9;
      --seq-track: #184f95;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
    --border: rgba(255,255,255,0.10); --good-text: #0ca30c;
    --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500;
    --s5: #199e70; --s6: #d95926; --s7: #9085e9;
    --seq-track: #184f95;
  }

  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.45; }
  header { padding: 16px 20px 0; max-width: 860px; margin: 0 auto; }
  header h1 { font-size: 20px; font-weight: 650; }
  .hdr-right { float: right; display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  nav { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--grid); }
  nav button { background: none; border: none; font: inherit; color: var(--ink-2); padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; white-space: nowrap; }
  nav button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--s1); }
  @media (max-width: 680px) {
    nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
  }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 700px) { .grid.cols-2 { grid-template-columns: 1fr 1fr; } .grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; } }

  .tile .label { font-size: 12.5px; color: var(--ink-2); }
  .tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hero { text-align: center; padding: 26px 18px; }
  .hero .label { font-size: 14px; color: var(--ink-2); }
  .hero .value { font-size: 52px; font-weight: 650; line-height: 1.15; }
  .hero .note { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .pos { color: var(--good-text); } .neg { color: var(--critical); }

  .meter { height: 10px; border-radius: 5px; background: var(--seq-track); overflow: hidden; margin-top: 10px; }
  .meter > div { height: 100%; border-radius: 5px 4px 4px 5px; background: var(--s1); }
  .meter.over > div { background: var(--critical); }

  .hbar-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .hbar-row .cat { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar { height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-row .val { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  form.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: var(--ink-2); }
  input, select { font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--baseline); border-radius: 6px; padding: 6px 8px; }
  input:focus, select:focus { outline: 2px solid var(--s1); outline-offset: -1px; }
  button.btn { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; border: none; background: var(--s1); color: #fff; cursor: pointer; }
  button.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--baseline); font-weight: 500; }
  button.mini { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  button.mini:hover { color: var(--critical); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.covered { background: color-mix(in srgb, var(--status-good) 15%, transparent); color: var(--good-text); }
  .badge.counts { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--ink); }
  .badge.warn { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--ink); }
  .badge.crit { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .gitem { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  .gitem:last-child { border-bottom: none; }
  .gitem .why { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .gitem select { font-size: 12.5px; padding: 3px 6px; }
  .gitem.off { opacity: .5; }
  .gitem h3, #guide h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 14px 0 4px; }
  input.cellnum { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month-nav b { font-size: 15px; text-transform: capitalize; }

  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mchip { border: 1px solid var(--border); background: var(--page); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
  .mchip b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .warnbox { background: color-mix(in srgb, var(--warning) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; cursor: pointer; }
  .chk:last-child { border-bottom: none; }
  .chk input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; flex-shrink: 0; }
  .chk .done { text-decoration: line-through; color: var(--muted); }
  .chk .done .hint { text-decoration: none; }
  .rate-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; align-items: baseline; }
  .rate-row:last-child { border-bottom: none; }
  .rate-row .rr-rate { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rate-row .why { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  @media print { header nav, form, button, select, .month-nav button, #mk-status, .hdr-right { display: none !important } body { background: #fff } .card { break-inside: avoid } }

  /* ─── Assistente de metas (wizard) ─── */
  #wizard { position: fixed; inset: 0; background: var(--page); z-index: 50; display: none; overflow-y: auto; }
  #wizard.on { display: flex; align-items: center; justify-content: center; }
  .wz { max-width: 480px; width: 100%; padding: 32px 24px; }
  .wz .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
  .wz .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
  .wz .step-dots span.done { background: var(--s1); }
  .wz h2 { font-size: 24px; font-weight: 650; line-height: 1.3; margin-bottom: 8px; }
  .wz p.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 22px; }
  .wz .biginput { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wz .biginput .cur { font-size: 22px; color: var(--muted); font-weight: 600; }
  .wz input[type=number], .wz input[type=month] { font-size: 26px; font-weight: 600; padding: 10px 12px; width: 100%; }
  .wz .live { font-size: 14px; color: var(--ink-2); min-height: 44px; margin: 10px 0 18px; }
  .wz .live b.pos { color: var(--good-text); }
  .wz .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 8px; }
  .wz .sugg { font-size: 13px; color: var(--s1); background: none; border: 1px dashed var(--baseline); border-radius: 6px; padding: 5px 10px; cursor: pointer; margin-bottom: 14px; }
  .wz .resumo { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; font-size: 14.5px; }
  .wz .resumo div { display: flex; justify-content: space-between; padding: 5px 0; }
  .wz .resumo div.total { border-top: 1px solid var(--grid); margin-top: 6px; padding-top: 10px; font-weight: 650; font-size: 16px; }
  .wz-lang { text-align: center; margin-bottom: 16px; }
  .wz-lang button, .lang-btn { background: none; border: 1px solid var(--baseline); border-radius: 6px; color: var(--ink-2); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }

  /* ─── Login / conta ─── */
  #auth { position: fixed; inset: 0; background: var(--page); z-index: 60; display: none; overflow-y: auto; }
  #auth.on { display: flex; align-items: center; justify-content: center; }
  .auth-card { max-width: 380px; width: 100%; padding: 32px 24px; }
  .auth-card h2 { font-size: 24px; font-weight: 650; margin-bottom: 6px; }
  .auth-card p.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 20px; }
  .auth-card input { width: 100%; font-size: 16px; padding: 10px 12px; margin-bottom: 10px; }
  .auth-card .btn { width: 100%; padding: 11px; margin-top: 4px; }
  .auth-err { color: var(--critical); font-size: 13px; min-height: 18px; margin: 6px 0; }
  .auth-skip { text-align: center; margin-top: 14px; }
  .auth-skip button { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  #sync-badge { font-size: 12px; color: var(--muted); }
  #sync-badge button { background: none; border: 1px solid var(--baseline); border-radius: 6px; color: var(--ink-2); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>

<!-- ─────────── Assistente de metas ─────────── -->
<div id="wizard"><div class="wz">
  <div class="wz-lang"><button onclick="toggleLang()" id="wz-lang-btn">English</button></div>
  <div class="step-dots" id="wz-dots"></div>
  <div id="wz-body"></div>
</div></div>

<!-- ─────────── Login / conta ─────────── -->
<div id="auth"><div class="auth-card">
  <div class="wz-lang" style="text-align:right"><button onclick="toggleLang()" id="au-lang-btn">English</button></div>
  <h2>Folga</h2>
  <p class="sub" data-i18n="authSub"></p>
  <input type="email" id="au-email" data-i18n-ph="authEmail" autocomplete="email">
  <input type="password" id="au-pass" data-i18n-ph="authPass" autocomplete="current-password">
  <div class="auth-err" id="au-err"></div>
  <button class="btn" onclick="sbLogin()" data-i18n="authLogin"></button>
  <button class="btn ghost" onclick="sbSignup()" data-i18n="authSignup"></button>
  <div class="auth-skip"><button onclick="authSkip()" data-i18n="authSkip"></button></div>
</div></div>

<header>
  <div class="hdr-right">
    <span id="sync-badge"></span>
    <button class="lang-btn" onclick="toggleLang()" id="hdr-lang-btn">EN</button>
  </div>
  <h1>Folga</h1>
  <nav id="nav">
    <button data-tab="inicio" class="active" data-i18n="navHome"></button>
    <button data-tab="lanc" data-i18n="navEntries"></button>
    <button data-tab="invest" data-i18n="navInvest"></button>
    <button data-tab="ideias" data-i18n="navIdeas"></button>
    <button data-tab="relatorio" data-i18n="navReport"></button>
    <button data-tab="rewards" data-i18n="navRewards"></button>
    <button data-tab="metas" data-i18n="navGoals"></button>
    <button data-tab="config" data-i18n="navConfig"></button>
  </nav>
</header>
<main>

<!-- ─────────── INÍCIO ─────────── -->
<section class="tab active" id="tab-inicio">
  <div class="month-nav">
    <button class="btn ghost" onclick="moveMonth(-1)" aria-label="prev">‹</button>
    <b id="m-title"></b>
    <button class="btn ghost" onclick="moveMonth(1)" aria-label="next">›</button>
    <span id="m-badge"></span>
  </div>

  <div class="card hero">
    <div class="label" data-i18n="heroLabel"></div>
    <div class="value" id="h-livre"></div>
    <div class="note" id="h-note"></div>
  </div>

  <div class="grid cols-3">
    <div class="card tile">
      <div class="label" data-i18n="tEarned"></div>
      <div class="value" id="t-ganho"></div>
      <div class="note" id="t-ganho-n"></div>
    </div>
    <div class="card tile">
      <div class="label" data-i18n="tSaved"></div>
      <div class="value" id="t-guardado"></div>
      <div class="note" id="t-guardado-n"></div>
      <div class="meter" id="t-guardado-m"><div></div></div>
    </div>
    <div class="card tile">
      <div class="label" data-i18n="tSpent"></div>
      <div class="value" id="t-gasto"></div>
      <div class="note" id="t-gasto-n"></div>
    </div>
  </div>

  <div class="card" id="br-strip" style="padding:10px 18px; font-size:13.5px"></div>

  <div class="grid cols-2">
    <div class="card">
      <h2 data-i18n="whereTitle"></h2>
      <div id="m-cats"></div>
    </div>
    <div class="card">
      <h2 data-i18n="prevTitle"></h2>
      <div id="m-prev"></div>
    </div>
  </div>
</section>

<!-- ─────────── LANÇAMENTOS ─────────── -->
<section class="tab" id="tab-lanc">
  <div class="card">
    <h2 data-i18n="lancTitle"></h2>
    <form class="inline" id="f-lanc">
      <div class="field"><label data-i18n="lancType"></label>
        <select id="l-type">
          <option value="gasto" data-i18n="typeExpense"></option>
          <option value="renda" data-i18n="typeIncome"></option>
          <option value="aporte" data-i18n="typeInvest"></option>
        </select>
      </div>
      <div class="field"><label data-i18n="lancDate"></label><input type="date" id="l-date" required></div>
      <div class="field"><label data-i18n="lancAmount"></label><input type="number" id="l-amount" inputmode="decimal" step="0.01" min="0.01" required style="width:110px"></div>
      <div class="field" id="l-cur-f"><label data-i18n="lancCur"></label><select id="l-cur"><option value="USD">US$</option><option value="BRL">R$</option></select></div>
      <div class="field" id="l-cat-f"><label data-i18n="lancCat"></label><select id="l-cat"></select></div>
      <div class="field" id="l-trip-f"><label data-i18n="lancTrip"></label>
        <select id="l-trip">
          <option value="none" data-i18n="tripNone"></option>
          <option value="work" data-i18n="tripWork"></option>
          <option value="personal" data-i18n="tripPersonal"></option>
        </select>
      </div>
      <div class="field" style="flex:1; min-width:140px"><label data-i18n="lancDesc"></label><input type="text" id="l-desc" data-i18n-ph="lancDescPh"></div>
      <button class="btn" type="submit" data-i18n="btnAdd"></button>
    </form>
    <div class="hint" id="l-hint"></div>
  </div>
  <div class="card">
    <h2 data-i18n="lancHist"></h2>
    <div id="l-list"></div>
  </div>
</section>

<!-- ─────────── METAS ─────────── -->
<section class="tab" id="tab-metas">
  <div class="card">
    <h2 data-i18n="goalWealthTitle"></h2>
    <div id="g-patrimonio"></div>
  </div>
  <div class="grid cols-2">
    <div class="card">
      <h2 data-i18n="goalMonthlyTitle"></h2>
      <div id="g-mensal"></div>
    </div>
    <div class="card">
      <h2 data-i18n="goalIncomeTitle"></h2>
      <div id="g-renda"></div>
    </div>
  </div>
  <button class="btn ghost" onclick="startWizard()" data-i18n="goalRedo"></button>
</section>

<!-- ─────────── INVESTIR (visão completa) ─────────── -->
<section class="tab" id="tab-invest">
  <div class="card">
    <h2 style="display:flex; justify-content:space-between; align-items:center; gap:10px"><span data-i18n="mkTitle"></span>
      <button class="btn ghost" style="font-size:12.5px; padding:4px 10px" onclick="fetchMarket(true)" data-i18n="mkRefresh"></button>
    </h2>
    <div class="chiprow" id="mk-chips"></div>
    <div class="hint" id="mk-status"></div>
  </div>

  <div class="card">
    <h2 data-i18n="apTitle"></h2>
    <div id="ap-context" style="font-size:13.5px; margin-bottom:10px"></div>
    <div class="grid cols-2">
      <div>
        <h3 style="font-size:13px; font-weight:600; color:var(--ink-2); margin:8px 0" data-i18n="apBrTitle"></h3>
        <div id="ap-br"></div>
      </div>
      <div>
        <h3 style="font-size:13px; font-weight:600; color:var(--ink-2); margin:8px 0" data-i18n="apUsTitle"></h3>
        <div id="ap-us"></div>
      </div>
    </div>
    <div class="disclaimer hint" id="ap-foot"></div>
  </div>

  <div class="card">
    <h2 data-i18n="chkTitle"></h2>
    <div id="chk-list"></div>
    <div class="hint" data-i18n="chkHint"></div>
  </div>

  <div class="card">
    <h2 data-i18n="ivTitle"></h2>
    <div id="iv-resumo"></div>
  </div>
  <div class="grid cols-2">
    <div class="card">
      <h2 data-i18n="portTitle"></h2>
      <form class="inline" id="f-port">
        <div class="field" style="flex:1"><label data-i18n="portAsset"></label><input type="text" id="p-name" data-i18n-ph="portAssetPh" required></div>
        <div class="field"><label data-i18n="portValue"></label><input type="number" id="p-value" inputmode="decimal" step="100" min="0" required style="width:110px"></div>
        <button class="btn" type="submit" data-i18n="btnAdd"></button>
      </form>
      <div id="p-list" style="margin-top:10px"></div>
      <div class="hint" data-i18n="portHint"></div>
      <button class="btn ghost" style="margin-top:8px" onclick="syncPortfolio()" data-i18n="portSync"></button>
    </div>
    <div class="card">
      <h2 data-i18n="apListTitle"></h2>
      <div id="iv-aportes"></div>
      <div class="hint" data-i18n="apListHint"></div>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="oppTitle"></h2>
    <form class="inline" id="f-opp">
      <div class="field" style="flex:1; min-width:150px"><label data-i18n="oppName"></label><input type="text" id="o-name" required></div>
      <div class="field"><label data-i18n="oppWhere"></label><select id="o-where"><option value="EUA" data-i18n="oppUS"></option><option value="Brasil" data-i18n="oppBR"></option></select></div>
      <div class="field"><label>Status</label><select id="o-status"><option value="avaliando" data-i18n="stEval"></option><option value="descartado" data-i18n="stDrop"></option><option value="investido" data-i18n="stDone"></option></select></div>
      <div class="field"><label data-i18n="oppPrio"></label><select id="o-prio"><option value="alta" data-i18n="prHigh"></option><option value="media" selected data-i18n="prMed"></option><option value="baixa" data-i18n="prLow"></option></select></div>

const DEFAULTS = {

  },
  expenses: [], incomes: [], contributions: [],
  portfolio: [], opportunities: [], rewards: [], fuel: [], guide: {},
  ideas: {}, checklist: {}, market: null,
};

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { ...structuredClone(DEFAULTS), ...d, settings: { ...DEFAULTS.settings, ...d.settings } };
    }
    const s = structuredClone(DEFAULTS);
    // migra lançamentos da versão anterior, se houver
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      s.expenses = o.expenses || [];
      s.incomes = o.incomes || [];
      s.contributions = o.contributions || [];
      s.portfolio = o.portfolio || [];
      s.opportunities = o.opportunities || [];
      s.rewards = o.rewards || [];
      s.fuel = o.fuel || [];
      s.guide = o.guide || {};
      if (o.settings) {
        s.settings.fx = o.settings.fx || s.settings.fx;
        if (o.settings.paycheck) s.settings.usMonthly = Math.round(o.settings.paycheck * 26 / 12);
        if (Array.isArray(o.portfolio)) s.settings.investedBase = o.portfolio.reduce((t2,p) => t2 + (p.value||0), 0) || s.settings.investedBase;
        if (o.settings.goal) s.settings.goalAmount = o.settings.goal;
      }
    }
    return s;
  } catch { return structuredClone(DEFAULTS); }
}
function save() { S._ts = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); sbQueuePush(); }
function uid() { return Date.now() + Math.random().toString(16).slice(2, 6); }

/* Idioma: detecta do navegador na primeira vez; persiste (e sincroniza) depois */

function setLang(l) {
  lang = l === "en" ? "en" : "pt";

}
function toggleLang() { setLang(lang === "pt" ? "en" : "pt"); }

/* ───────── Utilitários ───────── */
const fmtUS = n => (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtUS0 = n => (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtBR = n => "R$ " + n.toLocaleString(lang === "pt" ? "pt-BR" : "en-US", { maximumFractionDigits: 0 });
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtD = d => d.toLocaleDateString(dloc(), { day:"2-digit", month:"short" });
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthKey = s => s.slice(0, 7);
const thisMonth = () => todayStr().slice(0, 7);
function monthLabel(mk) {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(dloc(), { month: "long", year: "numeric" });
}
function shiftMonth(mk, n) {
  const [y, m] = mk.split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function counts(e) { return !(e.trip === "work" && COVERED_ON_WORK.includes(e.cat)); }
const toUSD = (amount, cur) => cur === "BRL" ? amount / S.settings.fx : amount;
const toBRL = (amount, cur) => cur === "USD" ? amount * S.settings.fx : amount;
const ptn = n => lang === "pt" ? n.toFixed(2).replace(".", ",") : n.toFixed(2);

/* ───────── Números do mês ───────── */
function monthStats(mk) {
  const st = S.settings;
  const exp = S.expenses.filter(e => monthKey(e.date) === mk);
  const spent = exp.filter(counts).reduce((s,e) => s + e.amount, 0);
  const covered = exp.filter(e => !counts(e)).reduce((s,e) => s + e.amount, 0);
  const inc = S.incomes.filter(x => monthKey(x.date) === mk);
  const extrasUS = inc.filter(x => (x.cur || "USD") === "USD").reduce((s,x) => s + x.amount, 0);
  const extrasBR = inc.filter(x => x.cur === "BRL").reduce((s,x) => s + x.amount, 0);
  const con = S.contributions.filter(c => monthKey(c.date) === mk);
  const savedUSD = con.filter(c => c.cur === "USD").reduce((s,c) => s + c.amount, 0);
  const savedBRL = con.filter(c => c.cur === "BRL").reduce((s,c) => s + c.amount, 0);
  // Livre = SÓ o lado EUA: salário US + extras US − compromisso de guardar − gastos.
  // O Brasil (salário + extras em R$) fica à parte, destinado a investimentos.
  const ganho = st.usMonthly + extrasUS;
  const brGanho = st.brMonthly + extrasBR;
  const saved = savedUSD + (savedBRL > 0 ? savedBRL / st.fx : 0);
  const reservado = Math.max(st.saveMonthly, savedUSD);
  const livre = ganho - reservado - spent;
  return { spent, covered, extrasUS, extrasBR, savedUSD, savedBRL, saved, ganho, brGanho, livre, reservado };
}
function invested() {
  return S.settings.investedBase + S.contributions.reduce((s,c) => s + toBRL(c.amount, c.cur), 0);
}
function monthHasData(mk) {
  return S.expenses.some(e => monthKey(e.date) === mk) ||
    S.incomes.some(x => monthKey(x.date) === mk) ||
    S.contributions.some(c => monthKey(c.date) === mk);
}
function firstDataMonth() {
  const all = [...S.expenses, ...S.incomes, ...S.contributions].map(x => monthKey(x.date));
  return all.length ? all.sort()[0] : thisMonth();
}
function monthsUntilGoal() {
  if (!S.settings.goalMonth) return 0;
  const [gy, gm] = S.settings.goalMonth.split("-").map(Number);
  const [cy, cm] = thisMonth().split("-").map(Number);
  return Math.max(0, (gy - cy) * 12 + (gm - cm));
}
function paceNeededBRL() {
  const falta = Math.max(0, S.settings.goalAmount - invested());
  const m = monthsUntilGoal();
  return m > 0 ? falta / m : falta;
}

/* ───────── Início ───────── */
let viewMonth = null;
function moveMonth(n) { viewMonth = shiftMonth(viewMonth || thisMonth(), n); renderInicio(); }
function renderInicio() {
  const mk = viewMonth || thisMonth();
  const cur = thisMonth();
  const st = monthStats(mk);
  document.getElementById("m-title").textContent = monthLabel(mk);
  document.getElementById("m-badge").innerHTML =
    mk === cur ? `<span class="badge counts">${t("mCur")}</span>` :
    mk < cur ? `<span class="badge covered">${t("mClosed")}</span>` : `<span class="badge warn">${t("mFuture")}</span>`;

  const livreEl = document.getElementById("h-livre");
  livreEl.textContent = fmtUS(st.livre);
  livreEl.className = "value " + (st.livre < 0 ? "neg" : "");
  const dias = mk === cur ? Math.max(1, new Date(+mk.split("-")[0], +mk.split("-")[1], 0).getDate() - new Date().getDate() + 1) : 0;
  document.getElementById("h-note").textContent =
    mk < cur ? t("heroClosedNote") :
    mk > cur ? t("heroFutureNote") :
    st.livre >= 0 ? t("heroPerDay", fmtUS0(st.livre / dias)) : t("heroOver", fmtUS0(-st.livre));

  document.getElementById("t-ganho").textContent = fmtUS0(st.ganho);
  document.getElementById("t-ganho-n").textContent =
    st.extrasUS > 0 ? t("tEarnedExtras", fmtUS0(S.settings.usMonthly), fmtUS0(st.extrasUS))
      : S.settings.brMonthly > 0 ? t("tEarnedSplit") : t("tEarnedOnly");

  const brStrip = document.getElementById("br-strip");
  if (st.brGanho > 0) {
    brStrip.style.display = "";
    brStrip.innerHTML = t("brStrip", fmtBR(st.brGanho)) + " " +
      (st.savedBRL > 0 ? t("brStripDone", fmtBR(st.savedBRL)) : t("brStripTodo"));
  } else brStrip.style.display = "none";

  document.getElementById("t-guardado").textContent = fmtUS0(st.saved);
  document.getElementById("t-guardado-n").textContent = t("tSavedGoal", fmtUS0(S.settings.saveMonthly));
  const pctSave = S.settings.saveMonthly > 0 ? Math.min(100, st.saved / S.settings.saveMonthly * 100) : 0;
  document.getElementById("t-guardado-m").firstElementChild.style.width = pctSave + "%";

  document.getElementById("t-gasto").textContent = fmtUS0(st.spent);
  document.getElementById("t-gasto-n").textContent =
    st.covered > 0 ? t("tSpentCovered", fmtUS0(st.covered)) : t("tSpentOnly");

  /* Categorias */
  const byCat = {};
  S.expenses.filter(e => monthKey(e.date) === mk && counts(e)).forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
  const rows = CATS.filter(c => byCat[c.id]).sort((a,b) => byCat[b.id] - byCat[a.id]);
  const max = rows.length ? byCat[rows[0].id] : 0;
  document.getElementById("m-cats").innerHTML = rows.length === 0
    ? `<div class="empty">${t("noExpMonth")}</div>`
    : rows.map(c => `
      <div class="hbar-row" title="${esc(L(c.label))}: ${fmtUS(byCat[c.id])}">
        <span class="cat"><span class="dot" style="background:var(${c.color})"></span>${L(c.label)}</span>
        <div><div class="hbar" style="width:${max ? byCat[c.id]/max*100 : 0}%; background:var(${c.color})"></div></div>
        <span class="val">${fmtUS0(byCat[c.id])}</span>
      </div>`).join("");

  /* Mês passado */
  const pmk = shiftMonth(mk, -1);
  const p = monthStats(pmk);
  document.getElementById("m-prev").innerHTML = !monthHasData(pmk)
    ? `<div class="empty">${t("noPrev", monthLabel(pmk))}</div>`
    : `<table><tbody>
      <tr><td>${t("prevEarned")}</td><td class="num">${fmtUS(p.ganho)}</td></tr>
      <tr><td>${t("prevSpent")}</td><td class="num">${fmtUS(p.spent)}</td></tr>
      <tr><td>${t("prevSaved")}</td><td class="num">${fmtUS(p.saved)} ${p.saved >= S.settings.saveMonthly && S.settings.saveMonthly > 0 ? `<span class="badge covered">${t("goalOk")}</span>` : ""}</td></tr>
      <tr><td><b>${t("prevLeft")}</b></td><td class="num"><b class="${p.ganho - p.spent - p.savedUSD >= 0 ? "pos" : "neg"}">${fmtUS(p.ganho - p.spent - p.savedUSD)}</b></td></tr>
    </tbody></table>
    <div class="hint">${t("prevHint")}</div>`;
}

function updateLancForm() {

}
function updateLancHint() {
  const tp = document.getElementById("l-type").value;
  const el = document.getElementById("l-hint");
  if (tp === "gasto" && document.getElementById("l-trip").value === "work" && COVERED_ON_WORK.includes(document.getElementById("l-cat").value)) {
    el.innerHTML = t("hintCovered");
  } else if (tp === "aporte") {
    el.textContent = t("hintAporte");
  } else if (tp === "renda") {
    el.textContent = t("hintRenda");
  } else el.textContent = "";

function renderLanc() {
  const all = [
    ...S.expenses.map(e => ({ ...e, _t: "gasto" })),
    ...S.incomes.map(x => ({ ...x, _t: "renda" })),
    ...S.contributions.map(c => ({ ...c, _t: "aporte" })),
  ].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 60);
  document.getElementById("l-list").innerHTML = all.length === 0
    ? `<div class="empty">${t("noLanc")}</div>`
    : `<table><thead><tr><th>${t("thDate")}</th><th>${t("thType")}</th><th>${t("thDetail")}</th><th class="num">${t("thValue")}</th><th></th><th></th></tr></thead><tbody>` +
      all.map(x => {
        let det = "", badge = "", v = "";
        if (x._t === "gasto") {
          const c = CATS.find(k => k.id === x.cat) || CATS[6];
          det = `<span class="dot" style="background:var(${c.color})"></span>${L(c.label)}${x.trip !== "none" ? " · " + L(TRIPS[x.trip]) : ""}${x.desc ? " · " + esc(x.desc) : ""}`;
          badge = counts(x) ? "" : `<span class="badge covered">${t("bdgCovered")}</span>`;
          v = "− " + fmtUS(x.amount);
        } else if (x._t === "renda") {
          det = esc(x.source || t("incomeFallback"));
          badge = `<span class="badge counts">${t("bdgIncome")}</span>`;
          v = "+ " + (x.cur === "BRL" ? fmtBR(x.amount) : fmtUS(x.amount));
        } else {
          det = esc(x.dest || t("investFallback"));
          badge = `<span class="badge covered">${t("bdgInvest")}</span>`;
          v = (x.cur === "BRL" ? fmtBR(x.amount) : fmtUS(x.amount));
        }
        return `<tr><td>${fmtD(parseDate(x.date))}</td><td>${badge || t("wordExpense")}</td><td>${det}</td>
          <td class="num">${v}</td><td></td>
          <td style="width:30px"><button class="mini" title="${t("del")}" aria-label="${t("del")}" onclick="delLanc('${x._t}','${x.id}')">✕</button></td></tr>`;
      }).join("") + "</tbody></table>";
}
function delLanc(tp, id) {
  if (tp === "gasto") S.expenses = S.expenses.filter(x => String(x.id) !== String(id));
  if (tp === "renda") S.incomes = S.incomes.filter(x => String(x.id) !== String(id));
  if (tp === "aporte") S.contributions = S.contributions.filter(x => String(x.id) !== String(id));
  save(); renderAll();
}

  const mLeft = monthsUntilGoal();
  const pace = paceNeededBRL();
  const paceUSD = pace / st.fx;
  const last3 = [1,2,3].map(n => monthStats(shiftMonth(thisMonth(), -n)).saved);
  const media = last3.reduce((a,b) => a+b, 0) / 3;
  const ritmoOk = media * st.fx >= pace;

  document.getElementById("g-patrimonio").innerHTML = `
    <div class="tile">

        <input type="number" inputmode="decimal" step="10" value="${st.saveMonthly}" style="width:110px" onchange="setS('saveMonthly', this.value)"></div>

      <div class="field"><label>${t("gBaseLabel")}</label>
        <input type="number" inputmode="decimal" step="1000" value="${st.investedBase}" style="width:110px" onchange="setS('investedBase', this.value)"></div>

function renderInvest() {
  const st = S.settings;
  const inv = invested();
  const pct = Math.min(100, st.goalAmount > 0 ? inv / st.goalAmount * 100 : 0);
  const pace = paceNeededBRL();
  document.getElementById("iv-resumo").innerHTML = `

    </div>`;

  const totalPort = S.portfolio.reduce((s,p) => s + p.value, 0);
  document.getElementById("p-list").innerHTML = S.portfolio.length === 0
    ? `<div class="empty">${t("portEmpty")}</div>`
    : `<table><tbody>` + S.portfolio.map(p => `
      <tr><td>${esc(p.name)}</td>
        <td class="num"><input type="number" class="cellnum" value="${p.value}" step="100" onchange="setPortValue('${p.id}', this.value)"></td>
        <td style="width:30px"><button class="mini" title="${t("del")}" onclick="delPort('${p.id}')">✕</button></td></tr>`).join("") +
      `<tr><td><b>${t("portSum")}</b></td><td class="num"><b>${fmtBR(totalPort)}</b></td><td></td></tr></tbody></table>`;

  const cs = [...S.contributions].sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById("iv-aportes").innerHTML = cs.length === 0
    ? `<div class="empty">${t("apListEmpty")}</div>`
    : `<table><tbody>` + cs.map(c => `
      <tr><td>${fmtD(parseDate(c.date))}</td><td>${esc(c.dest || "")}</td>
        <td class="num">${c.cur === "BRL" ? fmtBR(c.amount) : fmtUS(c.amount)}</td>
        <td style="width:30px"><button class="mini" title="${t("del")}" onclick="delLanc('aporte','${c.id}')">✕</button></td></tr>`).join("") + `</tbody></table>`;

  const prioOrder = { alta: 0, media: 1, baixa: 2 };
  const statusBadge = { avaliando: "warn", investido: "covered", descartado: "crit" };
  const stLabel = { avaliando: t("stEval"), investido: t("stDone"), descartado: t("stDrop") };
  const os = [...S.opportunities].sort((a,b) =>
    (a.status === "descartado") - (b.status === "descartado") || prioOrder[a.prio] - prioOrder[b.prio]);
  document.getElementById("o-list").innerHTML = os.length === 0
    ? `<div class="empty">${t("oppEmpty")}</div>`
    : `<table><thead><tr><th>${t("thOpp")}</th><th>${t("thWhere")}</th><th>${t("thPrio")}</th><th>Status</th><th>${t("thNotes")}</th><th></th></tr></thead><tbody>` +
      os.map(o => `<tr ${o.status === "descartado" ? 'style="opacity:.55"' : ""}>
        <td>${esc(o.name)}</td><td>${o.where === "EUA" ? t("oppUS") : o.where === "Brasil" ? t("oppBR") : esc(o.where)}</td>
        <td>${o.prio === "alta" ? "🔺 " + t("prHigh") : o.prio === "media" ? t("prMed") : t("prLow")}</td>
        <td><span class="badge ${statusBadge[o.status]}">${stLabel[o.status]}</span>
          <select onchange="setOppStatus('${o.id}', this.value)" style="font-size:11px; padding:1px 2px; margin-left:4px">
            ${["avaliando","investido","descartado"].map(s2 => `<option value="${s2}" ${s2 === o.status ? "selected" : ""}>${stLabel[s2]}</option>`).join("")}
          </select></td>
        <td>${esc(o.notes || "")}</td>
        <td><button class="mini" title="${t("del")}" onclick="delOpp('${o.id}')">✕</button></td>
      </tr>`).join("") + "</tbody></table>";
}
function setPortValue(id, v) { const p = S.portfolio.find(p => String(p.id) === String(id)); if (p) { p.value = Math.max(0, Number(v) || 0); save(); renderInvest(); } }
function delPort(id) { S.portfolio = S.portfolio.filter(p => String(p.id) !== String(id)); save(); renderInvest(); }
function delOpp(id) { S.opportunities = S.opportunities.filter(o => String(o.id) !== String(id)); save(); renderInvest(); }
function setOppStatus(id, st) { const o = S.opportunities.find(o => String(o.id) === String(id)); if (o) { o.status = st; save(); renderInvest(); } }
function syncPortfolio() {
  const totalPort = S.portfolio.reduce((s,p) => s + p.value, 0);
  if (totalPort <= 0) return;
  const aportes = S.contributions.reduce((s,c) => s + toBRL(c.amount, c.cur), 0);
  S.settings.investedBase = totalPort - aportes;
  save(); renderAll();
}

    live: () => {

      const br = num("wz-in");
      return br > 0 ? t("wz2liveYes", fmtBR(br)) : t("wz2liveAsk");

    saveStep: () => {
      wzData.brMonthly = val("wz-has2") === "sim" ? num("wz-in") : 0;
      wzData.fx = num("wz-fx") || wzData.fx || 5.24;
    },
  },
  {
    title: () => t("wz3t"), sub: () => t("wz3s"),
    render: () => `<div class="biginput"><span class="cur">R$</span><input type="number" inputmode="decimal" id="wz-in" value="${wzData.investedBase}" step="1000" min="0"></div>`,
    live: () => "",
    saveStep: () => wzData.investedBase = num("wz-in"),
  },
  {
    title: () => t("wz4t"), sub: () => t("wz4s"),
    render: () => `
      <div class="biginput"><span class="cur">R$</span><input type="number" inputmode="decimal" id="wz-in" value="${wzData.goalAmount}" step="5000" min="0"></div>
      <div class="field" style="margin-top:10px"><label>${t("wz4until")}</label>
      <input type="month" id="wz-month" value="${wzData.goalMonth}"></div>`,
    live: () => {
      const goal = num("wz-in"), mm = val("wz-month");
      if (!goal || !mm) return "";
      const [gy, gm] = mm.split("-").map(Number);
      const [cy, cmo] = thisMonth().split("-").map(Number);
      const m = (gy - cy) * 12 + (gm - cmo);
      if (m <= 0) return t("wz4future");
      const pace = Math.max(0, goal - wzData.investedBase) / m;
      return t("wz4live", fmtBR(Math.max(0, goal - wzData.investedBase)), m, fmtBR(pace), fmtUS0(pace / wzData.fx));
    },
    saveStep: () => { wzData.goalAmount = num("wz-in"); wzData.goalMonth = val("wz-month"); },
  },
  {
    title: () => t("wz5t"), sub: () => t("wz5s"),
    render: () => {
      const pace = suggestedPace();
      return `<button class="sugg" onclick="document.getElementById('wz-in').value=${Math.ceil(pace)}; wzLive()">${t("wz5sugg", fmtUS0(pace))}</button>
        <div class="biginput"><span class="cur">$</span><input type="number" inputmode="decimal" id="wz-in" value="${wzData.saveMonthly || Math.ceil(pace)}" step="10" min="0"></div>`;
    },
    live: () => {
      const sv = num("wz-in");
      const pace = suggestedPace();
      let msg = t("wz5live", fmtUS0(wzData.usMonthly - sv));
      if (sv < pace) msg += t("wz5below", fmtUS0(pace));
      return msg;
    },
    saveStep: () => wzData.saveMonthly = num("wz-in"),
  },
  {
    title: () => t("wz6t"), sub: () => t("wz6s"),
    render: () => {
      return `<div class="resumo">
        <div><span>${t("wz6in")}</span><b>${fmtUS0(wzData.usMonthly)}</b></div>
        ${wzData.brMonthly > 0 ? `<div><span>${t("wz6br")}</span><b>${fmtBR(wzData.brMonthly)}</b></div>` : ""}
        <div><span>${t("wz6save")}</span><b>${fmtUS0(wzData.saveMonthly)}</b></div>
        <div><span>${t("wz6goal")}</span><b>${fmtBR(wzData.goalAmount)}${wzData.goalMonth ? t("wz6until") + monthLabel(wzData.goalMonth) : ""}</b></div>
        <div class="total"><span>${t("wz6free")}</span><b class="pos">${fmtUS0(wzData.usMonthly - wzData.saveMonthly)}</b></div>
      </div>
      <p class="sub">${t("wz6note")}</p>`;
    },
    live: () => "",
    saveStep: () => {},
  },
];
const num = id => Number(document.getElementById(id)?.value) || 0;
const val = id => document.getElementById(id)?.value || "";
function suggestedPace() {
  if (!wzData.goalMonth) return 0;
  const [gy, gm] = wzData.goalMonth.split("-").map(Number);
  const [cy, cmo] = thisMonth().split("-").map(Number);
  const m = Math.max(1, (gy - cy) * 12 + (gm - cmo));
  return Math.max(0, wzData.goalAmount - wzData.investedBase) / m / wzData.fx;
}
function startWizard() {
  const st = S.settings;
  wzData = {
    usMonthly: st.usMonthly, brMonthly: st.brMonthly, fx: st.fx,
    investedBase: st.investedBase, goalAmount: st.goalAmount,
    goalMonth: st.goalMonth || shiftMonth(thisMonth(), 12),
    saveMonthly: st.saveMonthly,
  };
  wzStep = 0;
  document.getElementById("wizard").classList.add("on");
  renderWizard();
}
function renderWizard() {
  const s = WZ_STEPS[wzStep];
  document.getElementById("wz-dots").innerHTML =
    WZ_STEPS.map((_, i) => `<span class="${i <= wzStep ? "done" : ""}"></span>`).join("");
  document.getElementById("wz-body").innerHTML = `
    <h2>${s.title()}</h2><p class="sub">${s.sub()}</p>
    ${s.render()}
    <div class="live" id="wz-live"></div>
    <div class="actions">
      ${wzStep > 0 ? `<button class="btn ghost" onclick="wzBack()">${t("wzBack")}</button>` : "<span></span>"}
      <button class="btn" onclick="wzNext()">${wzStep === WZ_STEPS.length - 1 ? t("wzDone") : t("wzNext")}</button>
    </div>`;
  const inp = document.getElementById("wz-in");
  if (inp) { inp.focus(); inp.select?.(); }
  document.querySelectorAll("#wz-body input").forEach(i => i.addEventListener("input", wzLive));
  wzLive();
}
function wzLive() {
  document.getElementById("wz-live").innerHTML = WZ_STEPS[wzStep].live() || "";
}
function wzBack() { WZ_STEPS[wzStep].saveStep(); wzStep--; renderWizard(); }
function wzNext() {
  const check = WZ_STEPS[wzStep].valid?.();
  if (check !== undefined && check !== true) {
    document.getElementById("wz-live").innerHTML = `<span class="neg">${check}</span>`;
    document.getElementById("wz-in")?.focus();
    return;
  }
  WZ_STEPS[wzStep].saveStep();
  if (wzStep < WZ_STEPS.length - 1) { wzStep++; renderWizard(); return; }
  Object.assign(S.settings, wzData, { onboarded: true });
  save();
  document.getElementById("wizard").classList.remove("on");
  document.getElementById("cfg-fx").value = S.settings.fx;
  renderAll();
}

/* ───────── Mercado ao vivo ─────────
   Fontes: AwesomeAPI (dólar), CoinGecko (BTC), Banco Central SGS (Selic 432, CDI 4389, IPCA 12m 13522).
   Sem chave de API; falha silenciosa → usa último dado salvo ou o snapshot da pesquisa. */
const MARKET_FALLBACK = { fx: 5.24, selic: 14.00, cdi: 13.90, ipca12: 4.64, btcusd: null, ts: null };
function marketData() { return { ...MARKET_FALLBACK, ...(S.market || {}) }; }
async function fetchMarket(force = false) {
  if (!navigator.onLine) { renderMarket(); return; }
  if (!force && S.market?.ts && Date.now() - S.market.ts < 30 * 60 * 1000) { renderMarket(); return; }
  const stEl = document.getElementById("mk-status");
  if (stEl) stEl.textContent = t("mkUpdating");
  const j = u => fetch(u).then(r => r.json());
  const bcbNum = v => Number(String(v?.[0]?.valor ?? "").replace(",", ".")) || null;
  const [fx, btc, selic, cdi, ipca] = await Promise.allSettled([
    j("https://economia.awesomeapi.com.br/json/last/USD-BRL"),
    j("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"),
    j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json"),
    j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json"),
    j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.13522/dados/ultimos/1?formato=json"),
  ]);
  const m = { ...(S.market || {}) };
  let ok = false;
  if (fx.status === "fulfilled" && Number(fx.value?.USDBRL?.bid)) { m.fx = Number(fx.value.USDBRL.bid); ok = true; }
  if (btc.status === "fulfilled" && btc.value?.bitcoin?.usd) { m.btcusd = btc.value.bitcoin.usd; ok = true; }
  if (selic.status === "fulfilled" && bcbNum(selic.value)) { m.selic = bcbNum(selic.value); ok = true; }
  if (cdi.status === "fulfilled" && bcbNum(cdi.value)) { m.cdi = bcbNum(cdi.value); ok = true; }
  if (ipca.status === "fulfilled" && bcbNum(ipca.value)) { m.ipca12 = bcbNum(ipca.value); ok = true; }
  if (ok) {
    m.ts = Date.now();
    S.market = m;
    if (m.fx) S.settings.fx = Math.round(m.fx * 100) / 100; // câmbio vivo entra nos cálculos
    save();
    renderAll();
  } else renderMarket();
}
function renderMarket() {
  const el = document.getElementById("mk-chips");
  if (!el) return;
  const m = marketData();
  el.innerHTML = `
    <span class="mchip">${t("mkDollar")} <b>R$ ${ptn(m.fx)}</b></span>
    ${m.btcusd ? `<span class="mchip">Bitcoin <b>$${Math.round(m.btcusd).toLocaleString("en-US")}</b></span>` : ""}
    <span class="mchip">${t("mkSelic")} <b>${ptn(m.selic)}%</b></span>
    <span class="mchip">${t("mkCdi")} <b>${ptn(m.cdi)}%</b></span>
    <span class="mchip">${t("mkIpca")} <b>${ptn(m.ipca12)}%</b></span>`;
  document.getElementById("mk-status").textContent = S.market?.ts
    ? t("mkLive", new Date(S.market.ts).toLocaleString(dloc(), { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }))
    : t("mkSnapshot");
}

function renderChecklist() {
  const el = document.getElementById("chk-list");
  if (!el) return;
  const mk = thisMonth();
  const ms = monthStats(mk);
  const marks = S.checklist[mk] || {};
  const prev = shiftMonth(mk, -1);
  const lastLivre = monthHasData(prev) ? monthStats(prev).livre : 0;
  const spent3 = [1, 2, 3].map(n => monthStats(shiftMonth(mk, -n)).spent).filter(v => v > 0);
  const avgSpend = spent3.length ? spent3.reduce((a, b) => a + b, 0) / spent3.length : Math.max(ms.spent, 800);
  const reservaAlvo = Math.round(avgSpend * 3 / 100) * 100;
  const items = [
    { id: "fatura", tt: t("chkCard"), w: t("chkCardWhy"), manual: true },
    { id: "reserva", tt: t("chkReserve", fmtUS0(reservaAlvo)), w: t("chkReserveWhy", fmtUS0(avgSpend)), manual: true },
    { id: "aporte", tt: t("chkCommit", fmtUS0(S.settings.saveMonthly)), w: t("chkCommitWhy"), auto: S.settings.saveMonthly > 0 && ms.savedUSD >= S.settings.saveMonthly },
    ...(S.settings.brMonthly > 0 ? [{ id: "brasil", tt: t("chkBr", fmtBR(S.settings.brMonthly)), w: t("chkBrWhy"), auto: ms.savedBRL >= S.settings.brMonthly * 0.9 }] : []),
    { id: "parado", tt: t("chkIdle"), w: lastLivre > 0 ? t("chkIdleWhy", fmtUS0(lastLivre), monthLabel(prev)) : t("chkIdleOk"), auto: lastLivre <= 0 },
  ];
  el.innerHTML = items.map(it => {
    const done = it.manual ? !!marks[it.id] : it.auto;
    return `<label class="chk"><input type="checkbox" ${done ? "checked" : ""} ${it.manual ? `onchange="toggleChk('${it.id}', this.checked)"` : "disabled"}>
      <span class="${done ? "done" : ""}"><b>${it.tt}</b><div class="hint" style="margin:0">${it.w}</div></span></label>`;
  }).join("");
}
function toggleChk(id, v) {
  const mk = thisMonth();

  document.getElementById("id-econ-head").innerHTML = adopted.length
    ? t("idAdopted", adopted.length, lo, hi, fmtUS0(hi * 12))
    : t("idTotal", IDEAS_ECON.reduce((s, i) => s + i.est[0], 0), IDEAS_ECON.reduce((s, i) => s + i.est[1], 0));
}
function setIdea(id, v) { S.ideas[id] = v; save(); renderIdeias(); }

/* ───────── Relatório ───────── */
let repMonth = null;
function moveRep(n) { repMonth = shiftMonth(repMonth || thisMonth(), n); renderRelatorio(); }
function renderRelatorio() {
  const el = document.getElementById("rep-resumo");
  if (!el) return;
  const mk = repMonth || thisMonth();
  const ms = monthStats(mk);
  document.getElementById("rep-title").textContent = monthLabel(mk);

  const taxaPoup = ms.ganho > 0 ? Math.max(0, (ms.ganho - ms.spent) / ms.ganho * 100) : 0;
  el.innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repEarnedUS")}</td><td class="num">${fmtUS(ms.ganho)}</td></tr>
    ${ms.brGanho > 0 ? `<tr><td>${t("repEarnedBR")}</td><td class="num">${fmtBR(ms.brGanho)}</td></tr>` : ""}
    <tr><td>${t("repSpentOwn")}</td><td class="num">${fmtUS(ms.spent)}</td></tr>
    <tr><td>${t("repCovered")}</td><td class="num">${fmtUS(ms.covered)}</td></tr>
    <tr><td>${t("repSavedUS")}</td><td class="num">${fmtUS(ms.savedUSD)}</td></tr>
    ${ms.savedBRL > 0 ? `<tr><td>${t("repSavedBR")}</td><td class="num">${fmtBR(ms.savedBRL)}</td></tr>` : ""}
    <tr><td><b>${t("repFree")}</b></td><td class="num"><b class="${ms.livre >= 0 ? "pos" : "neg"}">${fmtUS(ms.livre)}</b></td></tr>
    <tr><td>${t("repRate")}</td><td class="num">${taxaPoup.toFixed(0)}%</td></tr>
  </tbody></table>`;

  const byCat = {}, byCatPrev = {};
  S.expenses.filter(e => monthKey(e.date) === mk && counts(e)).forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
  S.expenses.filter(e => monthKey(e.date) === shiftMonth(mk, -1) && counts(e)).forEach(e => byCatPrev[e.cat] = (byCatPrev[e.cat] || 0) + e.amount);
  const rows = CATS.filter(c => byCat[c.id] || byCatPrev[c.id]).sort((a, b) => (byCat[b.id] || 0) - (byCat[a.id] || 0));
  document.getElementById("rep-cats").innerHTML = rows.length === 0
    ? `<div class="empty">${t("repNoExp")}</div>`
    : `<table class="rep"><tbody>` + rows.map(c => {
        const now = byCat[c.id] || 0, was = byCatPrev[c.id] || 0, d = now - was;
        const delta = was === 0 && now === 0 ? "" : d === 0 ? "=" :
          `<span class="${d > 0 ? "neg" : "pos"}">${d > 0 ? "▲" : "▼"} ${fmtUS0(Math.abs(d))}</span>`;
        return `<tr><td><span class="dot" style="background:var(${c.color})"></span>${L(c.label)}</td>
          <td class="num">${fmtUS0(now)}</td><td class="num" style="font-size:12px">${delta}</td></tr>`;
      }).join("") + `</tbody></table><div class="hint">${t("repDeltaHint")}</div>`;

  /* Patrimônio & meta */
  const st = S.settings;
  const inv = invested();
  const falta = Math.max(0, st.goalAmount - inv);
  const fdm = firstDataMonth();
  const [fy, fm] = fdm.split("-").map(Number);
  const [cy, cm] = thisMonth().split("-").map(Number);
  const span = Math.max(1, Math.min(3, (cy - fy) * 12 + (cm - fm) + 1));
  const media3 = [...Array(span)].map((_, n) => { const s = monthStats(shiftMonth(thisMonth(), -n)); return s.savedUSD * st.fx + s.savedBRL; });
  const mediaBRL = media3.reduce((a, b) => a + b, 0) / span;
  let proj = "";
  if (falta <= 0) proj = `<span class="badge covered">${t("bdgGoalDone")}</span>`;
  else if (mediaBRL > 0) {
    const meses = Math.ceil(falta / mediaBRL);
    const dataEst = shiftMonth(thisMonth(), meses);
    const alvoOk = st.goalMonth && dataEst <= st.goalMonth;
    proj = t("repProj", fmtBR(mediaBRL), monthLabel(dataEst)) + " " +
      (st.goalMonth ? (alvoOk ? `<span class="badge covered">${t("repBefore")}</span>` : `<span class="badge warn">${t("repAfter", monthLabel(st.goalMonth))}</span>`) : "");
  } else proj = t("repProjNone");
  document.getElementById("rep-meta").innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repInvested")}</td><td class="num">${fmtBR(inv)}</td></tr>
    <tr><td>${t("repGoal")}</td><td class="num">${fmtBR(st.goalAmount)}${st.goalMonth ? " · " + monthLabel(st.goalMonth) : ""}</td></tr>
    <tr><td>${t("repMissing")}</td><td class="num">${fmtBR(falta)}</td></tr>
    <tr><td>${t("repMonthContrib")}</td><td class="num">${fmtBR(ms.savedUSD * st.fx + ms.savedBRL)}</td></tr>
  </tbody></table><div style="font-size:13px; margin-top:8px">${proj}</div>`;

  /* Ano até aqui */
  const year = mk.slice(0, 4);
  const yms = [];
  const dataStart = firstDataMonth();
  for (let m = 1; m <= 12; m++) { const k = `${year}-${String(m).padStart(2, "0")}`; if (k <= mk && k >= dataStart) yms.push(k); }
  const tot = yms.reduce((acc, k) => {
    const s = monthStats(k);
    acc.ganho += s.ganho; acc.gasto += s.spent; acc.coberto += s.covered;
    acc.aporte += s.savedUSD * st.fx + s.savedBRL; acc.br += s.brGanho;
    return acc;
  }, { ganho: 0, gasto: 0, coberto: 0, aporte: 0, br: 0 });
  document.getElementById("rep-ytd").innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repYEarnedUS")}</td><td class="num">${fmtUS(tot.ganho)}</td></tr>
    ${tot.br > 0 ? `<tr><td>${t("repYEarnedBR")}</td><td class="num">${fmtBR(tot.br)}</td></tr>` : ""}
    <tr><td>${t("repYSpent")}</td><td class="num">${fmtUS(tot.gasto)}</td></tr>
    <tr><td>${t("repYCovered")}</td><td class="num">${fmtUS(tot.coberto)}</td></tr>
    <tr><td><b>${t("repYSaved")}</b></td><td class="num"><b>${fmtBR(tot.aporte)}</b></td></tr>
  </tbody></table>
  <div class="hint">${t("repYtdHint", year, monthLabel(mk))}</div>`;
}

   Estratégia de sync: estado inteiro com last-write-wins por _ts
   (suficiente para 1 usuário, N aparelhos). */
const SB_URL = "https://yeilsajnttrmkxnewpun.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllaWxzYWpudHRybWt4bmV3cHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mjk5MDAsImV4cCI6MjEwMjQwNTkwMH0.dqFnTtaiwKKuEPbFK4xfguM9rJFYqW4cEwMCn_x7UqY";
let sb = null, sbUser = null, sbPushTimer = null, sbLastPush = 0;

function sbConfigured() { return !!(SB_URL && SB_KEY && window.supabase); }
function initAuth() {
  applyLang();
  if (!sbConfigured()) { renderAuthUI(); wizardIfNeeded(); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  sb.auth.onAuthStateChange((_e, session) => {
    const was = !!sbUser;
    sbUser = session?.user || null;
    renderAuthUI();
    if (sbUser && !was) firstSync();
  });
  sb.auth.getSession().then(({ data }) => {
    if (!data?.session) {
      if (localStorage.getItem("mf-skip-login")) wizardIfNeeded();
      else document.getElementById("auth").classList.add("on");
    }
    // com sessão, o onAuthStateChange dispara firstSync, que decide sobre o wizard
  });
}
/* O wizard só abre depois que sabemos se há dados na nuvem — evita
   perguntar tudo de novo num aparelho novo já logado. */
function wizardIfNeeded() {
  if (!S.settings.onboarded) startWizard();
  else document.getElementById("wizard").classList.remove("on");
}
async function sbSignup() {
  const email = document.getElementById("au-email").value.trim();
  const pass = document.getElementById("au-pass").value;
  if (!email || pass.length < 6) return authErr(t("authFill"));
  authErr("");
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if (error) return authErr(traduzErro(error.message));
  if (!data?.session) return authErr(t("authConfirm"));
  document.getElementById("auth").classList.remove("on");
}
async function sbLogin() {
  const email = document.getElementById("au-email").value.trim();
  const pass = document.getElementById("au-pass").value;
  if (!email || !pass) return authErr(t("authFillLogin"));
  authErr("");
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return authErr(traduzErro(error.message));
  document.getElementById("auth").classList.remove("on");
}
async function sbLogout() {
  if (sb) await sb.auth.signOut();
  sbUser = null; renderAuthUI();
}
function authSkip() {
  localStorage.setItem("mf-skip-login", "1");
  document.getElementById("auth").classList.remove("on");
  wizardIfNeeded();
}
function authOpen() {
  localStorage.removeItem("mf-skip-login");
  authErr("");
  document.getElementById("auth").classList.add("on");
}
function authErr(msg) { document.getElementById("au-err").textContent = msg; }
function traduzErro(m) {
  if (/invalid login/i.test(m)) return t("errBadLogin");
  if (/already registered/i.test(m)) return t("errExists");
  if (/rate limit/i.test(m)) return t("errRate");
  if (/valid email/i.test(m)) return t("errEmail");
  return m;
}

/* Sync: pull no login/abertura, push (debounced) a cada save */
async function firstSync() {
  if (!sb || !sbUser) return;
  try {
    const { data, error } = await sb.from("app_state").select("data, updated_at").eq("user_id", sbUser.id).maybeSingle();
    if (error) throw error;
    const localTs = S._ts || 0;
    const localHasData = S.settings.onboarded || S.expenses.length || S.contributions.length;
    if (!data) {
      if (localHasData) await sbPushNow();      // primeiro aparelho: sobe o que já existe
    } else {
      const remoteTs = data.data?._ts || new Date(data.updated_at).getTime();
      if (remoteTs > localTs || !localHasData) {
        S = { ...structuredClone(DEFAULTS), ...data.data, settings: { ...DEFAULTS.settings, ...data.data.settings } };
        localStorage.setItem(KEY, JSON.stringify(S));
        document.getElementById("cfg-fx").value = S.settings.fx;
        if (S.settings.lang && S.settings.lang !== lang) { lang = S.settings.lang; applyLang(); }
        renderAll();
      } else if (localTs > remoteTs) await sbPushNow();
    }
  } catch (e) { console.warn("sync pull falhou:", e.message); }
  wizardIfNeeded();   // já configurado na nuvem? fecha o wizard; conta nova? abre
  renderAuthUI();
}
function sbQueuePush() {
  if (!sb || !sbUser) return;
  clearTimeout(sbPushTimer);
  sbPushTimer = setTimeout(sbPushNow, 1500);
}
async function sbPushNow() {
  if (!sb || !sbUser) return;
  try {
    const { error } = await sb.from("app_state").upsert({
      user_id: sbUser.id, data: S, updated_at: new Date().toISOString(),
    });
    if (error) throw error;
    sbLastPush = Date.now();
    renderAuthUI();
  } catch (e) { console.warn("sync push falhou:", e.message); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sbUser) firstSync();
});

function renderAuthUI() {
  const badge = document.getElementById("sync-badge");
  const cfg = document.getElementById("cfg-account");
  if (!sbConfigured()) {
    badge.innerHTML = "";
    if (cfg) cfg.innerHTML = `<div class="hint" style="margin:0">${t("cfgDataHint")}</div>`;
    return;
  }
  if (sbUser) {
    badge.innerHTML = sbLastPush ? t("syncOk", new Date(sbLastPush).toLocaleTimeString(dloc(), { hour: "2-digit", minute: "2-digit" })) : t("syncOn");
    if (cfg) cfg.innerHTML = `
      <div style="font-size:13.5px">${t("cfgConnected", esc(sbUser.email))}</div>
      <button class="btn ghost" style="margin-top:10px" onclick="sbLogout()">${t("cfgLogout")}</button>`;
  } else {
    badge.innerHTML = `<button onclick="authOpen()">${t("syncEnter")}</button>`;
    if (cfg) cfg.innerHTML = `
      <div style="font-size:13.5px">${t("cfgNoAccount")}</div>
      <button class="btn" style="margin-top:10px" onclick="authOpen()">${t("cfgEnter")}</button>`;
  }
}

/* ───────── Config / backup ───────── */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `folga-backup-${todayStr()}.json`;
  a.click();
}
function importData(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.settings || !Array.isArray(d.expenses)) throw new Error("invalid");
      S = { ...structuredClone(DEFAULTS), ...d, settings: { ...DEFAULTS.settings, ...d.settings } };
      save(); document.getElementById("cfg-fx").value = S.settings.fx; renderAll();
      alert(t("importOk"));
    } catch (e) { alert(t("importFail") + e.message); }
  };
  r.readAsText(f);
}
