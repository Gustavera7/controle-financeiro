}
function addTripBudget(ev, id) {
  ev.preventDefault();
  const tp = tripById(id);
  const v = Number(document.getElementById("tb-add").value) || 0;
  if (!tp || !(v > 0)) return false;
  tp.topups = tp.topups || [];
  tp.topups.push({ id: uid(), date: todayStr(), amount: v, cur: tp.budgetCur, why: document.getElementById("tb-why").value.trim() });
  save(); renderAll(); renderConfig(); renderSheet();
  return false;
}
function delTopup(id, tid) {
  const tp = tripById(id);
  if (!tp) return;
  tp.topups = (tp.topups || []).filter(x => String(x.id) !== String(tid));
  save(); renderAll(); renderConfig(); renderSheet();
}
/* Encerrar é o momento em que a viagem vira história: os gastos passam a
   contar no painel, e o que sobrou do orçamento volta para o livre. */
function closeTrip(id) {
  const tp = tripById(id);
  if (!tp || !confirm(tripIsLong(tp) ? t("tripEndLongAsk") : t("tripEndAsk"))) return;
  const st = tripStats(tp);
  tp.closed = true; tp.closedAt = todayStr();
  save();
  const sobra = st.left >= 0 ? t("tripLeftBack", fmtT(tp, st.left)) : t("tripLeftNone", fmtT(tp, -st.left));
  renderAll(); renderConfig();
  if (sheetView) renderSheet();
  fillPlaceSelect(); updateLancForm();
  /* Temporada longa já contava no painel o tempo todo — encerrar só fecha o lugar */
  if (!tripIsLong(tp)) alert(t("tripEndedOk", fmtM0(conv(st.spent, tp.cur, mainCur())), sobra));
}
function reopenTrip(id) {
  const tp = tripById(id);
  if (!tp) return;
  tp.closed = false; tp.closedAt = "";
  save(); renderAll(); renderConfig(); renderSheet(); fillPlaceSelect(); updateLancForm();
}
function delTrip(id) {
  const tp = tripById(id);
  if (!tp) return;
  const q = S.expenses.filter(e => String(e.place) === String(id)).length;
  if (!confirm(t("tripDelAsk", q))) return;
  S.expenses = S.expenses.filter(e => String(e.place) !== String(id));
  S.trips = S.trips.filter(x => String(x.id) !== String(id));
  save(); closeSheet(); renderAll(); renderConfig(); fillPlaceSelect(); updateLancForm();
}
function goLanc(place) {
  closeSheet();
  document.querySelector('nav button[data-tab="lanc"]')?.click();
  document.getElementById("l-type").value = "gasto";
  fillPlaceSelect();
  const el = document.getElementById("l-place");
  if (el && [...el.options].some(o => o.value === String(place))) { el.value = String(place); placeTouched = true; }
  updateLancForm();
  scrollTo({ top: 0, behavior: "smooth" });
  document.getElementById("l-amount").focus();
}

/* ───────── Países e viagens (Config) ───────── */
let tripFormOpen = false, tripFormCountry = "";
/* ───────── Aba Viagens ─────────
   A viagem de agora em cima, o formulário curto no meio e o histórico
   agrupado embaixo: agora, próximas e as que já foram. */

        <div class="field" id="tr-end-f"><label>${t("tripEnd")}</label><input type="date" id="tr-end"></div>
        <div class="field"><label id="tr-budget-lbl">${t("tripBudget")}</label>

/* Câmbio da viagem: tenta o valor de hoje; o usuário pode corrigir a qualquer momento */
async function tripFxAuto() {
  const el = document.getElementById("tr-fx");
  const cur = val("tr-cur"), m = mainCur();
  if (!el) return;
  const lbl = el.closest(".field")?.querySelector("label");
  if (lbl) lbl.textContent = t("tripFx", cur, m);
  if (!cur || cur === m || Number(el.value) > 0 || !navigator.onLine) return;
  const pair = `${m}-${cur}`;
  try {
    const r = await fetch(`https://economia.awesomeapi.com.br/json/last/${pair}`).then(x => x.json());
    const bid = Number(r?.[pair.replace("-", "")]?.bid);
    if (bid > 0 && !(Number(el.value) > 0)) el.value = Math.round(bid * 10000) / 10000;
  } catch { /* sem rede: o campo fica para o usuário preencher */ }
}
function createTrip(ev) {
  ev.preventDefault();
  const err = document.getElementById("tr-err");
  const kind = val("tr-kind") || "fun";
  const start = val("tr-start"), end = val("tr-end");
  const budget = num("tr-budget");
  if (!start || (kind !== "long" && !end)) { err.textContent = t("tripNeedDates"); return false; }
  if (end && end < start) { err.textContent = t("tripNeedDates"); return false; }
  if (!(budget > 0)) { err.textContent = t("tripNeedBudget"); return false; }
  const c = countryOf(val("tr-country"));
  S.trips.push({
    id: uid(), name: val("tr-name").trim(), country: c.c, cur: val("tr-cur") || c.cur, kind,
    start, end, fx: num("tr-fx"), budget, budgetCur: val("tr-bcur") || mainCur(),
    goal: num("tr-goal"), topups: [], closed: false, closedAt: "",
  });
  save();
  tripFormOpen = false; tripFormCountry = "";
  renderAll(); renderConfig(); fillPlaceSelect(); updateLancForm();
  return false;
}

function delCat(id) {

  if (!confirm(q ? t("catDelUsed", L(c.label), q) : t("catDelAsk", L(c.label)))) return;
  S.expenses = S.expenses.map(e => e.cat === id ? { ...e, cat: OUTROS } : e);
  S.rewards = (S.rewards || []).filter(r => r.cat !== id);

    .forEach(e => gastoCur[expCur(e)] = (gastoCur[expCur(e)] || 0) + e.amount);
  /* Patrimônio por moeda: cada ativo já carrega a moeda dele */
  const patrCur = {};
  (S.portfolio || []).forEach(p => patrCur[p.cur || wealthCur()] = (patrCur[p.cur || wealthCur()] || 0) + (Number(p.value) || 0));

      <tr><td><b>${t("tripWealth")}</b></td><td class="num"></td><td class="num"></td>
        <td class="num"><b>${fmtW0(totalPatr)}</b></td></tr>
    </tbody></table>
    ${viagens.length ? `<h3 style="font-size:13px; font-weight:600; color:var(--ink-2); margin:16px 0 4px">${t("repTripsTitle")}</h3>
      <table class="rep"><tbody>${viagens.map(tp => {
        const ts = tripStats(tp);
        return `<tr><td>${tripIcon(tp)} ${esc(tripName(tp))} ${tripBadge(tp)}</td>
          <td class="num">${t("repTripLine", fmtT(tp, ts.spent), fmtT(tp, ts.budget))}</td>

      }).join("")}</tbody></table>` : ""}
    <div class="hint">${t("repCountriesHint")}</div>`;

/* Trocar a moeda do patrimônio converte os valores guardados — o número muda de
   roupa, não de tamanho. Cada ativo da carteira já carrega a moeda dele. */
function setWealthCur(c) {
  const old = wealthCur();
  if (c === old) return;
  S.settings.investedBase = Math.round(conv(S.settings.investedBase, old, c) * 100) / 100;
  S.settings.goalAmount = Math.round(conv(S.settings.goalAmount, old, c) * 100) / 100;
  S.settings.wealthCur = c;
  save(); renderAll(); renderConfig();
}
function toggleCoveredCat(id, on) {

function importData(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.settings || !Array.isArray(d.expenses)) throw new Error("invalid");
      S = migrate(d);
      save(); _fmtCache.clear(); applyLang();
      alert(t("importOk"));
    } catch (e) { alert(t("importFail") + e.message); }
  };
  r.readAsText(f);
}

/* ───────── Instalação no celular ─────────
   Android/Chrome entrega um prompt nativo; iOS/Safari só aceita o caminho manual,
   então ali mostramos as instruções em vez do botão. */
let deferredPrompt = null;
const isStandalone = () =>
  matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function showInstallBar() {
  if (isStandalone() || localStorage.getItem("install-dismissed") === "1") return;
  const bar = document.getElementById("install-bar");
  const go = document.getElementById("install-go");
  const txt = document.getElementById("install-text");
  if (deferredPrompt) {
    txt.textContent = t("installBody");
    go.style.display = "";
  } else if (isIos()) {
    txt.textContent = t("installIos");
    go.style.display = "none";
  } else return; // desktop sem prompt: não atrapalha
  bar.classList.add("on");
}
function dismissInstall() {
  localStorage.setItem("install-dismissed", "1");
  document.getElementById("install-bar").classList.remove("on");
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBar();
});
document.getElementById("install-go").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("install-bar").classList.remove("on");
  if (outcome === "accepted") localStorage.setItem("install-dismissed", "1");
};
window.addEventListener("appinstalled", () => {
  localStorage.setItem("install-dismissed", "1");
  document.getElementById("install-bar").classList.remove("on");
});
if (isIos()) setTimeout(showInstallBar, 1500);

/* Marca o fim da rolagem das abas para tirar o esmaecido da borda */
const navEl = document.getElementById("nav");
const markNavEnd = () =>
  navEl.classList.toggle("at-end", navEl.scrollLeft + navEl.clientWidth >= navEl.scrollWidth - 4);
navEl.addEventListener("scroll", markNavEnd, { passive: true });
addEventListener("resize", markNavEnd);
markNavEnd();
</script>
</body>
</html>
