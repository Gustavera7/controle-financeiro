<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folga BETA — quanto está livre este mês</title>
<meta name="description" content="Sua folga do mês em um número: quanto entra, quanto guardar, quanto está livre para gastar sem culpa. Your month's slack in one number.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --page: #f9f9f7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --good-text: #006300; --critical: #d03b3b; --warning: #fab219; --status-good: #0ca30c;
    --s1: #2a78d6; --s2: #008300; --s3: #e87ba4; --s4: #eda100;
    --s5: #1baf7a; --s6: #eb6834; --s7: #4a3aa7;
    --s8: #a35a2a; --s9: #0f8b8d; --s10: #8e44ad;
    --seq-track: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
      --border: rgba(255,255,255,0.10); --good-text: #0ca30c;
      --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500;
      --s5: #199e70; --s6: #d95926; --s7: #9085e9;
      --s8: #c07a41; --s9: #17a2a4; --s10: #a569bd;
      --seq-track: #184f95;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
    --border: rgba(255,255,255,0.10); --good-text: #0ca30c;
    --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500;
    --s5: #199e70; --s6: #d95926; --s7: #9085e9;
    --s8: #c07a41; --s9: #17a2a4; --s10: #a569bd;
    --seq-track: #184f95;
  }

  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.45; }
  header { padding: 16px 20px 0; max-width: 860px; margin: 0 auto; }
  header h1 { font-size: 20px; font-weight: 650; }
  .hdr-right { float: right; display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  nav { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--grid); }
  nav button { background: none; border: none; font: inherit; color: var(--ink-2); padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; white-space: nowrap; }
  nav button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--s1); }
  @media (max-width: 680px) {
    nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    /* dedo, não mouse: alvos de toque confortáveis e sem zoom no foco (iOS amplia abaixo de 16px) */
    input, select { min-height: 44px; font-size: 16px; }
    button.btn { min-height: 44px; padding: 10px 18px; }
    nav button { padding: 10px 12px; }
    button.mini { min-width: 36px; min-height: 36px; font-size: 15px; }
    header { position: sticky; top: 0; z-index: 20; background: var(--page); padding-bottom: 0; }
    /* a borda do header vira a dica de que há mais abas para o lado */
    nav { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
    nav.at-end { -webkit-mask-image: none; mask-image: none; }
    main { padding-bottom: 90px; }
  }

  /* Convite para instalar — só aparece no navegador, some depois de instalado */
  #install-bar { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-width: 520px; margin: 0 auto; }
  #install-bar.on { display: block; }
  #install-bar b { font-size: 14.5px; }
  #install-bar p { font-size: 13px; color: var(--ink-2); margin: 3px 0 10px; }
  #install-bar .row { display: flex; gap: 8px; align-items: center; }
  #install-bar .row .btn { flex: 1; }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 700px) { .grid.cols-2 { grid-template-columns: 1fr 1fr; } .grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; } }

  .tile .label { font-size: 12.5px; color: var(--ink-2); }
  .tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hero { text-align: center; padding: 26px 18px; }
  .hero .label { font-size: 14px; color: var(--ink-2); }
  .hero .value { font-size: 52px; font-weight: 650; line-height: 1.15; }
  .hero .note { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .pos { color: var(--good-text); } .neg { color: var(--critical); }

  .meter { height: 10px; border-radius: 5px; background: var(--seq-track); overflow: hidden; margin-top: 10px; }
  .meter > div { height: 100%; border-radius: 5px 4px 4px 5px; background: var(--s1); }
  .meter.over > div { background: var(--critical); }

  .hbar-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .hbar-row .cat { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar { height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-row .val { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  form.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: var(--ink-2); }
  input, select { font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--baseline); border-radius: 6px; padding: 6px 8px; }
  input:focus, select:focus { outline: 2px solid var(--s1); outline-offset: -1px; }
  button.btn { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; border: none; background: var(--s1); color: #fff; cursor: pointer; }
  button.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--baseline); font-weight: 500; }
  button.mini { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  button.mini:hover { color: var(--critical); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.covered { background: color-mix(in srgb, var(--status-good) 15%, transparent); color: var(--good-text); }
  .badge.counts { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--ink); }
  .badge.warn { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--ink); }
  .badge.crit { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .gitem { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  .gitem:last-child { border-bottom: none; }
  .gitem .why { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .gitem select { font-size: 12.5px; padding: 3px 6px; }
  .gitem.off { opacity: .5; }
  .gitem h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 14px 0 4px; }
  input.cellnum { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month-nav b { font-size: 15px; text-transform: capitalize; }

  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mchip { border: 1px solid var(--border); background: var(--page); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
  .mchip b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .warnbox { background: color-mix(in srgb, var(--warning) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; cursor: pointer; }
  .chk:last-child { border-bottom: none; }
  .chk input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; flex-shrink: 0; }
  .chk .done { text-decoration: line-through; color: var(--muted); }
  .chk .done .hint { text-decoration: none; }
  .rate-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; align-items: baseline; }
  .rate-row:last-child { border-bottom: none; }
  .rate-row .rr-rate { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rate-row .why { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  @media print { header nav, form, button, select, .month-nav button, #mk-status, .hdr-right,
    #sheet, #wizard, #auth, #install-bar { display: none !important } body { background: #fff } .card { break-inside: avoid } }

  /* ─── Assistente de metas (wizard) ─── */
  #wizard { position: fixed; inset: 0; background: var(--page); z-index: 50; display: none; overflow-y: auto; }
  #wizard.on { display: flex; align-items: center; justify-content: center; }
  .wz { max-width: 480px; width: 100%; padding: 32px 24px; }
  .wz .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
  .wz .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
  .wz .step-dots span.done { background: var(--s1); }
  .wz h2 { font-size: 24px; font-weight: 650; line-height: 1.3; margin-bottom: 8px; }
  .wz p.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 22px; }
  .wz .biginput { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wz .biginput .cur { font-size: 22px; color: var(--muted); font-weight: 600; }
  .wz input[type=number], .wz input[type=month] { font-size: 26px; font-weight: 600; padding: 10px 12px; width: 100%; }
  .wz .live { font-size: 14px; color: var(--ink-2); min-height: 44px; margin: 10px 0 18px; }
  .wz .live b.pos { color: var(--good-text); }
  .wz .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 8px; }
  .wz .sugg { font-size: 13px; color: var(--s1); background: none; border: 1px dashed var(--baseline); border-radius: 6px; padding: 5px 10px; cursor: pointer; margin-bottom: 14px; }
  .wz .resumo { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; font-size: 14.5px; }
  .wz .resumo div { display: flex; justify-content: space-between; padding: 5px 0; }
  .wz .resumo div.total { border-top: 1px solid var(--grid); margin-top: 6px; padding-top: 10px; font-weight: 650; font-size: 16px; }
  .wz-lang { text-align: center; margin-bottom: 16px; }
  .wz-lang button, .lang-btn { background: none; border: 1px solid var(--baseline); border-radius: 6px; color: var(--ink-2); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }

  /* ─── Viagem em andamento ─── */
  .trip { border-left: 3px solid var(--s4); }
  .trip .thead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .trip .tname { font-size: 15px; font-weight: 650; }
  .trip .tbig { font-size: 30px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .trip .tsub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .trip .trow { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .trip .tacts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .trip .tacts .btn { font-size: 13.5px; padding: 7px 14px; }
  .place-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .place-row:last-child { border-bottom: none; }
  .place-row .pl { font-size: 14px; }
  .place-row .pw { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .catchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--page); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  .catchip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 0 0 2px; line-height: 1; }
  .catchip button:hover { color: var(--critical); }

  /* ─── Cartão que abre detalhe ─── */
  .card.tappable { cursor: pointer; }
  .card.tappable:hover { border-color: var(--baseline); }
  .card.tappable:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; }

  /* ─── Folha de detalhe (patrimônio) ─── */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; display: none; overflow-y: auto; padding: 24px 12px; }
  #sheet.on { display: block; }
  .sheet-card { background: var(--page); border: 1px solid var(--border); border-radius: 14px; max-width: 720px; margin: 0 auto; padding: 18px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sheet-head b { font-size: 18px; }
  .sheet-head .btn { padding: 6px 12px; }
  @media (max-width: 680px) {
    #sheet { padding: 0; }
    .sheet-card { border-radius: 0; min-height: 100%; padding: 16px 10px 90px; }
    .sheet-card .card { padding: 14px 12px; }
    .sheet-card th, .sheet-card td { padding: 7px 4px; }
  }

  /* ─── Rosca de alocação ─── */
  .donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .donut { flex-shrink: 0; }
  .donut-center { font-size: 13px; font-weight: 650; fill: var(--ink); }
  .donut-sub { font-size: 8.5px; fill: var(--muted); }
  .legend { flex: 1; min-width: 200px; }
  .legend-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; font-size: 13px; padding: 4px 0; }
  .legend-row .lv { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .legend-row .lp { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 44px; text-align: right; }
  .alloc-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
  .alloc-bar { height: 8px; border-radius: 4px; background: var(--seq-track); overflow: hidden; margin-top: 5px; position: relative; }
  .alloc-bar > i { display: block; height: 100%; border-radius: 4px; }
  .alloc-bar > u { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--ink); opacity: .55; }
  .steps { counter-reset: st; }
  .step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .step:last-child { border-bottom: none; }
  .step .n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--s1); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .step.done .n { background: var(--status-good); }
  .step label.n { background: none; }
  .step .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .step .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  /* ─── Login / conta ─── */
  #auth { position: fixed; inset: 0; background: var(--page); z-index: 60; display: none; overflow-y: auto; }
  #auth.on { display: flex; align-items: center; justify-content: center; }
  .auth-card { max-width: 380px; width: 100%; padding: 32px 24px; }
  .auth-card h2 { font-size: 24px; font-weight: 650; margin-bottom: 6px; }
  .auth-card p.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 20px; }
  .auth-card input { width: 100%; font-size: 16px; padding: 10px 12px; margin-bottom: 10px; }
  .auth-card .btn { width: 100%; padding: 11px; margin-top: 4px; }
  .auth-err { color: var(--critical); font-size: 13px; min-height: 18px; margin: 6px 0; }
  .auth-skip { text-align: center; margin-top: 14px; }
  .auth-skip button { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  #sync-badge { font-size: 12px; color: var(--muted); }
  #sync-badge button { background: none; border: 1px solid var(--baseline); border-radius: 6px; color: var(--ink-2); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }

  /* ─── Ajustes de dedo (vêm por último de propósito: precisam vencer o
         `font: inherit` dos campos, senão o iOS dá zoom ao focar) ─── */
  @media (max-width: 680px) {
    input, select, textarea { font-size: 16px; min-height: 44px; }
    /* opcao longa nao pode esticar a pagina: o campo encolhe, o texto corta */
    .field { min-width: 0; max-width: 100%; }
    .field select, .field input { max-width: 100%; }
    .grid > * { min-width: 0; }
    .wz input[type=number], .wz input[type=month] { font-size: 26px; }
    /* histórico é largo por natureza: rola dentro do cartão, nunca a página */
    #l-list, #o-list, .sheet-card .card > table { overflow-x: auto; }
  }
</style>
</head>
<body>

<!-- ─────────── Assistente de metas ─────────── -->
<div id="wizard"><div class="wz">
  <div class="wz-lang"><button onclick="toggleLang()" id="wz-lang-btn">English</button></div>
  <div class="step-dots" id="wz-dots"></div>
  <div id="wz-body"></div>
</div></div>

<!-- ─────────── Folha de detalhe (patrimônio) ─────────── -->
<div id="sheet" onclick="if(event.target===this) closeSheet()">
  <div class="sheet-card" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <b id="sheet-title"></b>
      <button class="btn ghost" onclick="closeSheet()" aria-label="fechar">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- ─────────── Login / conta ─────────── -->
<div id="auth"><div class="auth-card">
  <div class="wz-lang" style="text-align:right"><button onclick="toggleLang()" id="au-lang-btn">English</button></div>
  <h2>Folga</h2>
  <p class="sub" data-i18n="authSub"></p>
  <input type="email" id="au-email" data-i18n-ph="authEmail" autocomplete="email">
  <input type="password" id="au-pass" data-i18n-ph="authPass" autocomplete="current-password">
  <div class="auth-err" id="au-err"></div>
  <button class="btn" onclick="sbLogin()" data-i18n="authLogin"></button>
  <button class="btn ghost" onclick="sbSignup()" data-i18n="authSignup"></button>
  <div class="auth-skip"><button onclick="authSkip()" data-i18n="authSkip"></button></div>
</div></div>

<div id="install-bar">
  <b data-i18n="installTitle"></b>
  <p id="install-text"></p>
  <div class="row">
    <button class="btn" id="install-go" data-i18n="installBtn"></button>
    <button class="btn ghost" onclick="dismissInstall()" data-i18n="installLater"></button>
  </div>
</div>

<header>
  <div class="hdr-right">
    <span id="sync-badge"></span>
    <button class="lang-btn" onclick="toggleLang()" id="hdr-lang-btn">EN</button>
  </div>
  <h1>Folga <span class="badge warn" style="vertical-align:middle; font-size:10.5px">BETA</span></h1>
  <nav id="nav">
    <button data-tab="inicio" class="active" data-i18n="navHome"></button>
    <button data-tab="lanc" data-i18n="navEntries"></button>
    <button data-tab="invest" data-i18n="navInvest"></button>
    <button data-tab="viagens" data-i18n="navTrips"></button>

/* ═════════ Versão BETA ═════════
   Roda em /beta/ e guarda os dados numa chave própria: o app principal

   lá — e, se houver conta, busca uma única vez a versão da nuvem, caso ela
   esteja mais nova. Depois disso a beta é só deste aparelho: nunca escreve
   na nuvem, para não sobrescrever o app que você usa de verdade. */
const BETA = true;
const KEY = "folga-beta-v1";
const PROD_KEY = "controle-financeiro-v2";
const BETA_SEED = "folga-beta-seed";
const OLD_KEY = "controle-financeiro-v1";
function betaSeedLocal() {
  if (localStorage.getItem(KEY)) return;
  const raw = localStorage.getItem(PROD_KEY);
  if (!raw) return;
  localStorage.setItem(KEY, raw);
  localStorage.setItem("folga-beta-origem", new Date().toISOString());
}
betaSeedLocal();

/* Chute de tipo pelo nome do ativo — usado só quando o dado veio de uma versão
   sem tipo. O usuário corrige em um toque na tela de patrimônio. */
function guessType(name) {
  const n = String(name || "").toLowerCase();
  if (/bitcoin|btc|ether|eth\b|cripto|crypto|solana|usdt/.test(n)) return "cripto";
  if (/401|ira\b|roth|pgbl|vgbl|previd|pension/.test(n)) return "aposentadoria";
  if (/fii|reit|im[oó]ve|real estate|aluguel/.test(n)) return "imoveis";
  if (/a[cç][oõ]es|stock|etf|s&p|ivvb|bova|ivv|voo|vti|fundo|index|bolsa/.test(n)) return "acoes";
  if (/selic|tesouro|cdb|lci|lca|cdi|bond|treasury|t-bill|renda fixa|fixed|debent|certificate|\bcd\b/.test(n)) return "rendafixa";
  if (/poupan|savings|reserva|caixa|cash|hysa|conta|emerg/.test(n)) return "reserva";
  return "outros";
}

/* Normaliza qualquer estado (local, nuvem ou backup) para o formato atual.
   Idempotente: rodar duas vezes no mesmo objeto não muda nada. */
function migrate(d) {
  const s = { ...structuredClone(DEFAULTS), ...d, settings: { ...DEFAULTS.settings, ...(d.settings || {}) } };
  const st = s.settings;
  /* v2 → v3: "us/br" viram "principal/segundo" e ganham país e moeda explícitos */
  if (d?.settings && d.settings.mainMonthly === undefined) {
    st.mainMonthly = Number(d.settings.usMonthly) || 0;
    st.secondMonthly = Number(d.settings.brMonthly) || 0;
    st.hasSecond = st.secondMonthly > 0;
    st.homeCountry = "US"; st.homeCur = "USD";
    st.secondCountry = "BR"; st.secondCur = "BRL";
    st.freePolicy = "main";          // era a regra fixa do app
    st.wealthCur = "BRL";            // patrimônio e meta eram sempre em reais
  }
  delete st.usMonthly; delete st.brMonthly;
  if (!st.homeCur) st.homeCur = countryOf(st.homeCountry).cur;
  if (!st.secondCur) st.secondCur = countryOf(st.secondCountry).cur;
  if (!Array.isArray(st.coveredCats)) st.coveredCats = [...COVERED_DEFAULT];
  if (!st.hasSecond) st.secondMonthly = 0;
  /* carteira: cada ativo passa a ter tipo e moeda próprios. Para quem já tinha
     ativos cadastrados, o tipo é chutado pelo nome — melhor que jogar tudo em
     "Outros" e mostrar um gráfico de uma cor só. */
  s.portfolio = (s.portfolio || []).map(p => ({
    ...p, type: p.type || guessType(p.name), cur: p.cur || st.wealthCur || st.homeCur,
  }));
  s.accounts = s.accounts || [];
  s.offers = s.offers || [];
  /* Oportunidade agora tem valor, retorno esperado e risco — as antigas
     entram sem números e o usuário completa quando quiser. */
  s.opportunities = (s.opportunities || []).map(o => ({
    ...o, amount: Number(o.amount) || 0, ret: Number(o.ret) || 0,
    risk: ["baixo","medio","alto"].includes(o.risk) ? o.risk : "medio",
  }));
  /* Categorias do usuário: rótulo pode ter vindo como texto simples */
  s.cats = (s.cats || []).filter(c => c && c.id).map((c, i) => ({
    id: c.id,
    label: (c.label && typeof c.label === "object") ? c.label : { pt: String(c.label || c.id), en: String(c.label || c.id) },
    color: c.color || CAT_COLORS[i % CAT_COLORS.length],
    custom: true,
  }));
  /* Viagens e temporadas: tudo com moeda, orçamento e datas explícitos */
  s.trips = (s.trips || []).filter(tp => tp && tp.id).map(tp => ({
    id: tp.id,
    name: tp.name || "",
    country: tp.country || st.homeCountry,
    cur: tp.cur || countryOf(tp.country || st.homeCountry).cur,
    kind: ["fun","work","long"].includes(tp.kind) ? tp.kind : "fun",
    start: tp.start || "", end: tp.end || "",
    fx: Number(tp.fx) || 0,
    budget: Number(tp.budget) || 0,
    budgetCur: tp.budgetCur || st.homeCur,
    goal: Number(tp.goal) || 0,
    topups: Array.isArray(tp.topups) ? tp.topups : [],
    closed: !!tp.closed, closedAt: tp.closedAt || "",
  }));
  /* "Restaurantes" nasceu depois de "Comida": quem cobria comida em viagem a
     trabalho passa a cobrir restaurante também. Uma vez só — depois é escolha
     do usuário, e desmarcar tem que continuar valendo. */
  if (!st.catRestDone) {
    if (st.coveredCats.includes("alimentacao") && !st.coveredCats.includes("restaurante")) st.coveredCats.push("restaurante");
    st.catRestDone = true;
  }
  /* Gasto órfão (viagem apagada) volta a ser gasto de casa */
  const ids = new Set(s.trips.map(tp => String(tp.id)));
  s.expenses = (s.expenses || []).map(e =>
    (e.place && e.place !== "home" && e.place !== "second" && !ids.has(String(e.place)))
      ? { ...e, place: "home", cur: st.homeCur } : e);
  return s;
}

/* Dinheiro: um formatador por moeda+idioma, criado uma vez e reaproveitado.

      minimumFractionDigits: digits, maximumFractionDigits: digits };
    try { f = new Intl.NumberFormat(dloc(), opt); }
    catch { f = new Intl.NumberFormat(dloc(), { ...opt, currency: "USD" }); }

const fxRate = () => Number(S.settings.fx) > 0 ? Number(S.settings.fx) : 1;
/* Quantas unidades de `cur` valem 1 da moeda principal. A segunda moeda usa o
   câmbio das configurações; moedas de viagem, o câmbio da própria viagem. */
function unitsPerMain(cur) {
  if (!cur || cur === mainCur()) return 1;
  if (cur === secondCur() && S.settings.hasSecond && Number(S.settings.fx) > 0) return Number(S.settings.fx);
  const tp = (S.trips || []).find(x => x.cur === cur && Number(x.fx) > 0);

  return a / f * g;

const toWealth = (amount, cur) => conv(amount, cur || wealthCur(), wealthCur());

/* ───────── Números do mês ─────────
   Tudo que sai daqui na moeda principal, exceto o que tem sufixo Second. */
function monthStats(mk) {
  const st = S.settings;
  const M = mainCur(), SC = secondCur();
  const exp = S.expenses.filter(e => monthKey(e.date) === mk);
  /* Cada gasto na moeda em que aconteceu; o bolso decide se ele mexe no livre */
  let spent = 0, spentSecond = 0, covered = 0, tripSpent = 0;
  exp.forEach(e => {
    const c = expCur(e);
    if (reimbursed(e)) { covered += conv(e.amount, c, M); return; }
    if (inOpenTrip(e)) { tripSpent += conv(e.amount, c, M); return; }
    if (expBucket(e) === "second") spentSecond += e.amount;
    else spent += conv(e.amount, c, M);
  });
  const inc = S.incomes.filter(x => monthKey(x.date) === mk);
  const extrasMain = inc.filter(x => (x.cur || M) !== SC || SC === M).reduce((s,x) => s + conv(x.amount, x.cur || M, M), 0);
  const extrasSecond = SC === M ? 0 : inc.filter(x => x.cur === SC).reduce((s,x) => s + x.amount, 0);
  const con = S.contributions.filter(c => monthKey(c.date) === mk);
  const savedMain = con.filter(c => (c.cur || M) !== SC || SC === M).reduce((s,c) => s + conv(c.amount, c.cur || M, M), 0);
  const savedSecond = SC === M ? 0 : con.filter(c => c.cur === SC).reduce((s,c) => s + c.amount, 0);

  const rendaMain = st.mainMonthly + extrasMain;

  /* Política do livre: por padrão só a renda principal sustenta o mês — a segunda
     fica reservada para investir. Quem quiser soma as duas (config ou wizard). */
  const somaTudo = st.freePolicy === "all" && st.hasSecond;
  const ganho = rendaMain + (somaTudo ? toMain(rendaSecond, SC) : 0);
  const saved = savedMain + toMain(savedSecond, SC);
  const savedNoLivre = savedMain + (somaTudo ? toMain(savedSecond, SC) : 0);
  const reservado = Math.max(st.saveMonthly, savedNoLivre);
  const livre = ganho - reservado - spent;
  /* Sobra do segundo país: o que entrou lá, menos o que foi gasto e aportado lá */
  const leftSecond = rendaSecond - spentSecond - savedSecond;
  return { spent, spentSecond, tripSpent, covered, extrasMain, extrasSecond, savedMain, savedSecond, saved,
           ganho, rendaSecond, leftSecond, livre, reservado };
}
function invested() {
  return S.settings.investedBase + S.contributions.reduce((s,c) => s + toWealth(c.amount, c.cur), 0);
}
function monthHasData(mk) {
  return S.expenses.some(e => monthKey(e.date) === mk) ||
    S.incomes.some(x => monthKey(x.date) === mk) ||
    S.contributions.some(c => monthKey(c.date) === mk);
}
function firstDataMonth() {
  const all = [...S.expenses, ...S.incomes, ...S.contributions].map(x => monthKey(x.date));
  return all.length ? all.sort()[0] : thisMonth();
}
function monthsUntilGoal() {
  if (!S.settings.goalMonth) return 0;
  const [gy, gm] = S.settings.goalMonth.split("-").map(Number);
  const [cy, cm] = thisMonth().split("-").map(Number);
  return Math.max(0, (gy - cy) * 12 + (gm - cm));
}
/* Ritmo necessário para a meta, na moeda do patrimônio */
function paceNeeded() {
  const falta = Math.max(0, S.settings.goalAmount - invested());
  const m = monthsUntilGoal();
  return m > 0 ? falta / m : falta;
}
const paceNeededMain = () => conv(paceNeeded(), wealthCur(), mainCur());
/* "≈ US$ 1.234" só faz sentido quando patrimônio e dia a dia estão em moedas diferentes */
const alsoMain = v => wealthCur() === mainCur() ? "" : ` (≈ ${fmtM0(conv(v, wealthCur(), mainCur()))})`;

/* ───────── Início ───────── */
let viewMonth = null;
function moveMonth(n) { viewMonth = shiftMonth(viewMonth || thisMonth(), n); renderInicio(); }
function renderInicio() {
  const mk = viewMonth || thisMonth();
  const cur = thisMonth();
  const st = monthStats(mk);
  document.getElementById("m-title").textContent = monthLabel(mk);
  document.getElementById("m-badge").innerHTML =
    mk === cur ? `<span class="badge counts">${t("mCur")}</span>` :
    mk < cur ? `<span class="badge covered">${t("mClosed")}</span>` : `<span class="badge warn">${t("mFuture")}</span>`;

  /* Mês anterior ao primeiro lançamento não inventa "livre" — não havia app ainda */
  const vazio = !monthHasData(mk) && mk < firstDataMonth();
  const livreEl = document.getElementById("h-livre");
  livreEl.textContent = vazio ? "—" : fmtM(st.livre);
  livreEl.className = "value " + (!vazio && st.livre < 0 ? "neg" : "");
  const dias = mk === cur ? Math.max(1, new Date(+mk.split("-")[0], +mk.split("-")[1], 0).getDate() - new Date().getDate() + 1) : 0;
  document.getElementById("h-note").textContent =
    vazio ? t("heroEmptyNote") :
    mk < cur ? t("heroClosedNote") :
    mk > cur ? t("heroFutureNote") :
    st.livre >= 0 ? t("heroPerDay", fmtM0(st.livre / dias)) : t("heroOver", fmtM0(-st.livre));

  const set = (id, v) => document.getElementById(id).textContent = vazio ? "—" : v;
  set("t-ganho", fmtM0(st.ganho));
  document.getElementById("t-ganho-n").textContent =
    st.extrasMain > 0 ? t("tEarnedExtras", fmtM0(S.settings.mainMonthly), fmtM0(st.extrasMain))
      : (S.settings.hasSecond && S.settings.freePolicy === "main") ? t("tEarnedSplit", countryName(S.settings.secondCountry))
      : (S.settings.hasSecond && S.settings.freePolicy === "all") ? t("tEarnedBoth")
      : t("tEarnedOnly");

  /* Faixa da segunda renda: só existe se a pessoa declarou o segundo país e ele
     fica fora do livre (política "main"). Com política "all" já está no ganho. */
  const secStrip = document.getElementById("br-strip");
  const temSec = S.settings.hasSecond && S.settings.freePolicy === "main" &&
    (st.rendaSecond > 0 || st.spentSecond > 0 || st.savedSecond > 0);
  if (!vazio && temSec) {
    secStrip.style.display = "";
    secStrip.classList.add("tappable");
    secStrip.setAttribute("role", "button");
    secStrip.onclick = () => openSheet("country");
    secStrip.innerHTML = `<div style="display:flex; align-items:center; gap:10px">
        <span style="flex:1">${t("secStripFull", flagOf(S.settings.secondCountry), countryName(S.settings.secondCountry),
          fmtS0(st.rendaSecond), fmtS0(st.spentSecond), fmtS0(st.savedSecond), fmtS0(st.leftSecond))}</span>
        <span class="chev">›</span></div>` +
      (st.savedSecond > 0 ? "" : `<div class="hint" style="margin-top:2px">${t("secStripTodo")}</div>`);
  } else { secStrip.style.display = "none"; secStrip.onclick = null; }

  set("t-guardado", fmtM0(st.saved));
  document.getElementById("t-guardado-n").textContent = t("tSavedGoal", fmtM0(S.settings.saveMonthly));
  const pctSave = S.settings.saveMonthly > 0 ? Math.min(100, st.saved / S.settings.saveMonthly * 100) : 0;
  document.getElementById("t-guardado-m").firstElementChild.style.width = (vazio ? 0 : pctSave) + "%";

  set("t-gasto", fmtM0(st.spent));
  const notas = [];
  if (st.covered > 0) notas.push(t("tSpentCovered", fmtM0(st.covered)));
  if (st.tripSpent > 0) notas.push(t("tSpentTrip", fmtM0(st.tripSpent)));
  document.getElementById("t-gasto-n").textContent = notas.length ? notas.join(" · ") : t("tSpentOnly");

  /* Categorias */
  const byCat = {};
  S.expenses.filter(e => monthKey(e.date) === mk && counts(e) && expBucket(e) === "main")
    .forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + conv(e.amount, expCur(e), mainCur()));
  const rows = allCats().filter(c => byCat[c.id]).sort((a,b) => byCat[b.id] - byCat[a.id]);
  const max = rows.length ? byCat[rows[0].id] : 0;
  document.getElementById("m-cats").innerHTML = rows.length === 0
    ? `<div class="empty">${t("noExpMonth")}</div>`
    : rows.map(c => `
      <div class="hbar-row" title="${esc(L(c.label))}: ${fmtM(byCat[c.id])}">
        <span class="cat"><span class="dot" style="background:var(${c.color})"></span>${L(c.label)}</span>
        <div><div class="hbar" style="width:${max ? byCat[c.id]/max*100 : 0}%; background:var(${c.color})"></div></div>
        <span class="val">${fmtM0(byCat[c.id])}</span>
      </div>`).join("");

  /* Mês passado */
  const pmk = shiftMonth(mk, -1);
  const p = monthStats(pmk);
  document.getElementById("m-prev").innerHTML = !monthHasData(pmk)
    ? `<div class="empty">${t("noPrev", monthLabel(pmk))}</div>`
    : `<table><tbody>
      <tr><td>${t("prevEarned")}</td><td class="num">${fmtM(p.ganho)}</td></tr>
      <tr><td>${t("prevSpent")}</td><td class="num">${fmtM(p.spent)}</td></tr>
      <tr><td>${t("prevSaved")}</td><td class="num">${fmtM(p.saved)} ${p.saved >= S.settings.saveMonthly && S.settings.saveMonthly > 0 ? `<span class="badge covered">${t("goalOk")}</span>` : ""}</td></tr>
      <tr><td><b>${t("prevLeft")}</b></td><td class="num"><b class="${p.ganho - p.spent - p.savedMain >= 0 ? "pos" : "neg"}">${fmtM(p.ganho - p.spent - p.savedMain)}</b></td></tr>
    </tbody></table>
    <div class="hint">${t("prevHint")}</div>`;
}

/* O lugar escolhido no formulário (ou casa, quando não há escolha) */
function lancPlace() {
  const el = document.getElementById("l-place");
  if (!el || document.getElementById("l-type").value !== "gasto" || placeOptions().length < 2) return "home";
  return el.value || "home";
}
let placeTouched = false;
function fillPlaceSelect() {
  const el = document.getElementById("l-place");
  if (!el) return;
  const opts = placeOptions();
  const antes = el.value;
  el.innerHTML = opts.map(o => `<option value="${o.id}">${o.label}</option>`).join("");

  const agora = tripsNow()[0];

  else if (opts.some(o => o.id === antes)) el.value = antes;

  const tp = document.getElementById("l-type").value;

function updateLancHint() {

function delLanc(tp, id) {
  if (tp === "gasto") S.expenses = S.expenses.filter(x => String(x.id) !== String(id));
  if (tp === "renda") S.incomes = S.incomes.filter(x => String(x.id) !== String(id));

function setS(key, v) { S.settings[key] = Number(v) || 0; save(); renderAll(); }
function setPolicy(v) { S.settings.freePolicy = v === "all" ? "all" : "main"; save(); renderAll(); }

/* ═════════ Patrimônio: tipos, alocação e rosca ═════════
   Cada ativo tem um tipo — é o que permite mostrar "quanto % em cada coisa" e
   comparar com um alvo por perfil de risco. Valores educacionais, não conselho. */
const ASSET_TYPES = [
  { id:"reserva",     color:"--s1", label:{pt:"Reserva / caixa", en:"Cash & reserve"} },
  { id:"rendafixa",   color:"--s2", label:{pt:"Renda fixa", en:"Fixed income"} },
  { id:"acoes",       color:"--s3", label:{pt:"Ações e fundos", en:"Stocks & funds"} },
  { id:"aposentadoria",color:"--s4",label:{pt:"Aposentadoria (401k, PGBL)", en:"Retirement (401k, IRA)"} },
  { id:"imoveis",     color:"--s5", label:{pt:"Imóveis / FIIs / REITs", en:"Real estate / REITs"} },
  { id:"cripto",      color:"--s6", label:{pt:"Cripto", en:"Crypto"} },
  { id:"outros",      color:"--s7", label:{pt:"Outros", en:"Other"} },
];
const typeOf = id => ASSET_TYPES.find(x => x.id === id) || ASSET_TYPES[6];
const RISK_TARGETS = {
  conservador:   { reserva:20, rendafixa:55, acoes:12, aposentadoria:8,  imoveis:5, cripto:0, outros:0 },
  moderado:      { reserva:15, rendafixa:35, acoes:28, aposentadoria:12, imoveis:8, cripto:2, outros:0 },
  arrojado:      { reserva:10, rendafixa:20, acoes:42, aposentadoria:13, imoveis:10, cripto:5, outros:0 },
};
const riskProfile = () => RISK_TARGETS[S.settings.riskProfile] ? S.settings.riskProfile : "moderado";

/* Soma da carteira por tipo, tudo convertido para a moeda do patrimônio */
function allocation() {
  const by = {};
  let total = 0;
  S.portfolio.forEach(p => {
    const v = toWealth(p.value, p.cur);
    by[p.type || "outros"] = (by[p.type || "outros"] || 0) + v;
    total += v;
  });
  return { by, total };
}
/* Rosca em SVG puro — sem biblioteca, sem requisição, funciona offline */
function donut(parts, total, centerTop, centerSub) {
  const R = 54, C = 2 * Math.PI * R;
  let acc = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => {
    const frac = total > 0 ? p.v / total : 0;
    const seg = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(${p.color})" stroke-width="22"
      stroke-dasharray="${(frac * C).toFixed(2)} ${(C - frac * C).toFixed(2)}"
      stroke-dashoffset="${(-acc * C).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(p.name)}: ${(frac*100).toFixed(0)}%</title></circle>`;
    acc += frac;
    return seg;
  }).join("");
  return `<svg class="donut" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(centerTop)}">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--grid)" stroke-width="22"></circle>
    ${arcs}
    <text x="70" y="68" text-anchor="middle" class="donut-center">${esc(centerTop)}</text>
    <text x="70" y="82" text-anchor="middle" class="donut-sub">${esc(centerSub)}</text>
  </svg>`;
}

/* ───────── Investimentos (visão completa) ───────── */
function renderInvest() {
  const st = S.settings;
  const inv = invested();
  const pct = Math.min(100, st.goalAmount > 0 ? inv / st.goalAmount * 100 : 0);
  const pace = paceNeeded();
  const { by, total } = allocation();
  const parts = ASSET_TYPES.map(ty => ({ ...ty, name: L(ty.label), v: by[ty.id] || 0 }));
  const top = parts.filter(p => p.v > 0).sort((a,b) => b.v - a.v).slice(0, 3);
  document.getElementById("iv-resumo").innerHTML = `
    <div class="donut-wrap">
      ${total > 0 ? donut(parts, total, fmtW0(total).replace(/\s/g, " "), t("wsAlloc")) : ""}
      <div class="legend">
        <div class="tile" style="margin-bottom:8px">
          <div class="value" style="font-size:32px">${fmtW0(inv)}</div>
          <div class="meter"><div style="width:${pct}%"></div></div>
          <div class="hint">${t("ivLine", pct.toFixed(0), fmtW0(st.goalAmount), st.goalMonth ? monthLabel(st.goalMonth) : "", fmtW0(pace), alsoMain(pace))}</div>
        </div>
        ${total > 0
          ? top.map(p => `<div class="legend-row"><span><span class="dot" style="background:var(${p.color})"></span>${p.name}</span>
              <span class="lv">${fmtW0(p.v)}</span><span class="lp">${(p.v/total*100).toFixed(0)}%</span></div>`).join("")
          : `<div class="hint">${t("wsEmptyCta")}</div>`}
      </div>
    </div>`;

  const cs = [...S.contributions].sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById("iv-aportes").innerHTML = cs.length === 0
    ? `<div class="empty">${t("apListEmpty")}</div>`
    : `<table><tbody>` + cs.map(c => `
      <tr><td>${fmtD(parseDate(c.date))}</td><td>${esc(c.dest || "")}</td>
        <td class="num">${fmtCur(c.amount, c.cur || mainCur())}</td>
        <td style="width:30px"><button class="mini" title="${t("del")}" onclick="delLanc('aporte','${c.id}')">✕</button></td></tr>`).join("") + `</tbody></table>`;

  const stLabel = { avaliando: t("stEval"), investido: t("stDone"), descartado: t("stDrop") };
  const riskLabel = { baixo: t("riskLo"), medio: t("riskMid"), alto: t("riskHi") };
  const riskBadge = { baixo: "covered", medio: "counts", alto: "warn" };
  /* Ordem: o que ainda está vivo primeiro, e dentro disso o que mais rende
     acima da régua — a lista já é a resposta. */
  const vantagem = o => { const c = oppCompare(o); return c ? c.delta : -999; };
  const os = [...S.opportunities].sort((a,b) =>
    (a.status === "descartado") - (b.status === "descartado") ||
    vantagem(b) - vantagem(a) || (b.amount || 0) - (a.amount || 0));
  document.getElementById("o-list").innerHTML = os.length === 0
    ? `<div class="empty">${t("oppEmpty")}</div>`
    : os.map(o => {
        const cur = oppCur(o);
        const cmp = oppCompare(o);
        const linha1 = [oppWhereLabel(o.where), o.amount > 0 ? fmtCur(o.amount, cur, 0) : "",
          o.ret > 0 ? t("oppPerYear", pctn(o.ret)) : ""].filter(Boolean).join(" · ");
        const linha2 = cmp
          ? `${cmp.delta >= 0 ? t("oppAbove", pctn(cmp.delta), cmp.safe.n, pctn(cmp.safe.r))
              : t("oppBelow", pctn(-cmp.delta), cmp.safe.n, pctn(cmp.safe.r))} · ` +
            `${t("oppInYears", cmp.anos, fmtCur(cmp.meu, cur, 0), fmtCur(cmp.seguro, cur, 0))} ` +
            `<b class="${cmp.dif >= 0 ? "pos" : "neg"}">${cmp.dif >= 0 ? "+" : "−"}${fmtCur(Math.abs(cmp.dif), cur, 0)}</b>`
          : t("oppNums");
        return `<div class="gitem ${o.status === "descartado" ? "off" : ""}">
          <div><b>${esc(o.name)}</b> <span class="badge ${riskBadge[o.risk] || "counts"}">${riskLabel[o.risk] || riskLabel.medio}</span>
            <div class="why">${linha1}</div>
            <div class="why">${linha2}</div>
            ${o.notes ? `<div class="why">${esc(o.notes)}</div>` : ""}</div>
          <div style="display:flex; gap:4px; align-items:center">
            <select onchange="setOppStatus('${o.id}', this.value)">
              ${["avaliando","investido","descartado"].map(s2 => `<option value="${s2}" ${s2 === o.status ? "selected" : ""}>${stLabel[s2]}</option>`).join("")}
            </select>
            <button class="mini" title="${t("del")}" onclick="delOpp('${o.id}')">✕</button></div>
        </div>`;
      }).join("");
  document.getElementById("o-foot").textContent = t("oppFoot", RATES_ASOF);
}
/* "Onde" das oportunidades: hoje guarda o código do país; dados antigos guardam o nome */
function oppWhereLabel(w) {
  if (w === "EUA") return countryName("US");
  if (w === "Brasil") return countryName("BR");
  return /^[A-Z]{2}$/.test(w || "") ? `${flagOf(w)} ${countryName(w)}` : esc(w || "");
}
function setPortValue(id, v) { const p = S.portfolio.find(p => String(p.id) === String(id)); if (p) { p.value = Math.max(0, Number(v) || 0); save(); afterWealthEdit(); } }
function setPortType(id, ty) { const p = S.portfolio.find(p => String(p.id) === String(id)); if (p) { p.type = ty; save(); afterWealthEdit(); } }
function setPortCur(id, c) { const p = S.portfolio.find(p => String(p.id) === String(id)); if (p) { p.cur = c; save(); afterWealthEdit(); } }
function delPort(id) { S.portfolio = S.portfolio.filter(p => String(p.id) !== String(id)); save(); afterWealthEdit(); }
function delOpp(id) { S.opportunities = S.opportunities.filter(o => String(o.id) !== String(id)); save(); renderInvest(); }
const oppCur = o => countryOf(o.where).cur;
/* Compara o retorno que você espera com o que renderia sem risco, e mostra
   onde os dois chegam em 5 anos. Só aparece quando há números para comparar. */
function oppCompare(o) {
  const safe = safeRateFor(oppCur(o));
  if (!(o.amount > 0) || !(o.ret > 0) || !safe || !(safe.r > 0)) return null;
  const anos = 5;
  return { safe, anos,
    meu: o.amount * Math.pow(1 + o.ret / 100, anos),
    seguro: o.amount * Math.pow(1 + safe.r / 100, anos),
    delta: o.ret - safe.r,
    get dif() { return this.meu - this.seguro; } };
}
function oppCurLabel() {
  const el = document.getElementById("o-amount-lbl");
  const w = document.getElementById("o-where");
  if (el && w) el.textContent = `${t("oppAmount")} (${curSym(countryOf(w.value).cur)})`;
}
function setOppStatus(id, st) { const o = S.opportunities.find(o => String(o.id) === String(id)); if (o) { o.status = st; save(); renderInvest(); } }
function afterWealthEdit() { renderAll(); if (document.getElementById("sheet").classList.contains("on")) renderSheet(); }
function setRisk(v) { S.settings.riskProfile = v; save(); afterWealthEdit(); }
/* O total do app (base + aportes) e a soma da carteira podem divergir; este botão
   reconcilia ajustando a base, sem mexer no histórico de aportes. */
function syncPortfolio() {
  const { total } = allocation();
  if (total <= 0) return;
  const aportes = S.contributions.reduce((s,c) => s + toWealth(c.amount, c.cur), 0);
  S.settings.investedBase = Math.round((total - aportes) * 100) / 100;
  save(); afterWealthEdit();
}

function addAsset(e) {

/* ───────── Rewards (visão completa) ───────── */

/* ═════════ Leitura dos gastos × retorno ═════════
   O app já sabe onde seu dinheiro vai. Aqui ele cruza isso com o que você
   registrou de cartões/programas e com as ofertas de parceiros, e diz onde
   está deixando dinheiro na mesa. As faixas abaixo são referências públicas de
   mercado (retorno típico de cartões da categoria) — não são ofertas do Folga. */
const CAT_BENCH = {
  alimentacao: [2, 6], combustivel: [2, 5], compras: [1, 5],
  passagens: [2, 5], hoteis: [3, 10], carro: [1, 3], outros: [1, 2],
};
/* Média mensal de gasto do bolso por categoria, nos últimos meses com dados */
function spendByCat(nMonths = 3) {
  const mk = thisMonth();
  const months = [];
  for (let i = 0; i < nMonths; i++) {
    const k = shiftMonth(mk, -i);
    if (monthHasData(k)) months.push(k);
  }
  if (!months.length) months.push(mk);
  const by = {};
  S.expenses.filter(e => months.includes(monthKey(e.date)) && counts(e))
    .forEach(e => by[e.cat] = (by[e.cat] || 0) + conv(e.amount, expCur(e), mainCur()));
  Object.keys(by).forEach(k => by[k] = by[k] / months.length);
  return { by, months: months.length };
}
const offerActive = o => !o.until || o.until >= thisMonth();
function bestOfferFor(cat) {
  return [...S.offers].filter(o => o.cat === cat && offerActive(o)).sort((a,b) => b.rate - a.rate)[0] || null;
}
function rewardsInsights() {
  const { by, months } = spendByCat();
  const rows = allCats().map(c => {
    const spend = by[c.id] || 0;
    const mine = S.rewards.filter(r => r.cat === c.id).sort((a,b) => b.rate - a.rate)[0] || null;
    const offer = bestOfferFor(c.id);
    const bench = CAT_BENCH[c.id] || [1, 2];
    const rate = mine ? mine.rate : 0;
    /* O melhor cenário é o maior entre "cartão típico da categoria" e
       "o que você já tem + a oferta de parceiro" (elas se somam no caixa). */
    const withOffer = rate + (offer ? offer.rate : 0);
    const bestRate = Math.max(bench[1], withOffer);
    const earn = spend * rate / 100;
    const could = spend * bestRate / 100;
    return { c, spend, mine, offer, bench, rate, withOffer, bestRate, earn, could, missed: Math.max(0, could - earn) };
  }).filter(r => r.spend > 0);
  const totalSpend = rows.reduce((s,r) => s + r.spend, 0);
  return {
    rows: rows.sort((a,b) => b.missed - a.missed || b.spend - a.spend),
    months, totalSpend,
    earn: rows.reduce((s,r) => s + r.earn, 0),
    could: rows.reduce((s,r) => s + r.could, 0),
  };
}
function renderRewardInsights() {
  const head = document.getElementById("rx-head");
  if (!head) return;
  const ins = rewardsInsights();
  if (!ins.rows.length) {
    head.innerHTML = `<div class="empty">${t("rxEmpty")}</div>`;
    document.getElementById("rx-list").innerHTML = "";
    document.getElementById("rx-foot").textContent = "";
    return;
  }
  const top = [...ins.rows].sort((a,b) => b.spend - a.spend)[0];
  const gain = ins.could - ins.earn;
  head.innerHTML = `
    <div class="chiprow" style="margin-bottom:10px">
      <span class="mchip">${t("rxSpend")} <b>${fmtM0(ins.totalSpend)}</b>${t("idPerMonth")}</span>
      <span class="mchip">${t("rxEarn")} <b class="pos">${fmtM0(ins.earn)}</b>${t("idPerMonth")}</span>
      <span class="mchip">${t("rxCould")} <b>${fmtM0(ins.could)}</b>${t("idPerMonth")}</span>
    </div>
    <div style="font-size:14px">${t("rxLead", L(top.c.label), fmtM0(top.spend), top.mine ? t("rxLeadHas", esc(top.mine.prog), ptn(top.rate)) : t("rxLeadNone"), fmtM0(gain * 12))}</div>`;

  /* Cada linha é uma decisão possível, na ordem do dinheiro que está na mesa:
     o que você gasta, o que volta hoje e o botão que resolve ali mesmo. */
  document.getElementById("rx-list").innerHTML = ins.rows.map(r => {
    const editando = rxOpen === r.c.id;
    const hoje = r.mine ? t("rxHas", esc(r.mine.prog), pctn(r.rate), fmtM0(r.earn)) : t("rxNone");
    const alvo = r.offer ? t("rxOffer", esc(r.offer.partner), pctn(r.offer.rate)) : t("rxBench", r.bench[0], r.bench[1]);
    const ganho = r.missed > 0.5 ? ` \u00b7 <b class="pos">+${fmtM0(r.missed * 12)}</b> ${t("rxPerYear")}` : "";
    return `<div class="gitem">
      <div style="flex:1; min-width:0">
        <b><span class="dot" style="background:var(${r.c.color})"></span>${esc(L(r.c.label))}</b>
        <span style="color:var(--muted); font-size:12.5px"> ${fmtM0(r.spend)}${t("idPerMonth")}</span>
        <div class="why">${hoje}</div>
        <div class="why">${alvo}${ganho}</div>
        ${editando ? `<form class="inline" style="margin-top:8px" onsubmit="return rxSave(event,'${r.c.id}')">
          <div class="field" style="flex:1; min-width:130px"><label>${t("rwProg")}</label>
            <input type="text" id="rx-prog" value="${r.mine ? esc(r.mine.prog) : ""}" placeholder="${t("rwProgPh")}" required></div>
          <div class="field"><label>${t("rwRate")}</label>
            <input type="number" id="rx-rate" inputmode="decimal" step="any" min="0" style="width:80px" value="${r.mine ? r.mine.rate : ""}" required></div>
          <button class="btn" type="submit">${t("rxSaveBtn")}</button>
          <button class="btn ghost" type="button" onclick="rxEdit('${r.c.id}')">${t("rxCancel")}</button>
        </form>` : ""}
      </div>
      ${editando ? "" : `<button class="btn ghost" onclick="rxEdit('${r.c.id}')">${r.mine ? t("rxChange") : t("rxAddCard")}</button>`}
    </div>`;
  }).join("");
  document.getElementById("rx-foot").innerHTML = t("rxFoot", ins.months);
}

/* Registrar o cartão na própria linha do gasto: nenhuma volta ao formulário */
let rxOpen = null;
function rxEdit(cat) { rxOpen = rxOpen === cat ? null : cat; renderRewardInsights(); }
function rxSave(ev, cat) {
  ev.preventDefault();
  const prog = document.getElementById("rx-prog").value.trim();
  const rate = Number(document.getElementById("rx-rate").value) || 0;
  if (!prog) return false;
  const atual = S.rewards.filter(r => r.cat === cat).sort((a, b) => b.rate - a.rate)[0];
  if (atual) { atual.prog = prog; atual.rate = rate; }
  else S.rewards.push({ id: uid(), cat, prog, rate });
  rxOpen = null;
  save(); renderRewards(); renderRewardInsights();
  return false;
}

/* Ofertas: hoje o próprio usuário cadastra o que negociou; o formato já é o que
   um parceiro do Folga enviaria (parceiro, categoria, % extra, validade). */
function renderOffers() {
  const el = document.getElementById("of-list");
  if (!el) return;
  const list = [...S.offers].sort((a,b) => (offerActive(b) - offerActive(a)) || b.rate - a.rate);
  el.innerHTML = list.length === 0
    ? `<div class="empty">${t("ofEmpty")}</div>`
    : list.map(o => {
        const c = catById(o.cat);
        const { by } = spendByCat();
        const val = (by[o.cat] || 0) * o.rate / 100;
        return `<div class="gitem ${offerActive(o) ? "" : "off"}">
          <div><b>${esc(o.partner)}</b> <span class="badge counts">+${ptn(o.rate)}%</span>
            ${offerActive(o) ? "" : `<span class="badge crit">${t("ofExpired")}</span>`}
            <div class="why"><span class="dot" style="background:var(${c.color})"></span>${L(c.label)}
              ${o.until ? " · " + t("ofValid", monthLabel(o.until)) : ""}
              ${val > 0.5 ? " · " + t("ofWorth", fmtM0(val)) : ""}</div></div>
          <button class="mini" title="${t("del")}" onclick="delOffer('${o.id}')">✕</button>
        </div>`;
      }).join("");
}
function delOffer(id) { S.offers = S.offers.filter(o => String(o.id) !== String(id)); save(); renderOffers(); renderRewardInsights(); }

function renderRewards() {
  /* Preço de combustível por galão só faz sentido nos EUA */
  document.getElementById("fuel-card").style.display = S.settings.homeCountry === "US" ? "" : "none";
  renderRewardInsights();
  renderOffers();
  const rs = [...S.rewards].sort((a,b) => a.cat.localeCompare(b.cat) || b.rate - a.rate);
  const bestByCat = {};
  rs.forEach(r => { if (!bestByCat[r.cat] || r.rate > bestByCat[r.cat]) bestByCat[r.cat] = r.rate; });
  document.getElementById("r-list").innerHTML = rs.length === 0
    ? `<div class="empty">${t("rwEmpty")}</div>`
    : `<table><thead><tr><th>${t("lancCat")}</th><th>${t("thProg")}</th><th class="num">${t("thReturn")}</th><th></th></tr></thead><tbody>` +
      rs.map(r => {

const MARKET_FALLBACK = { fx: 5.24, selic: 14.00, cdi: 13.90, ipca12: 4.64, btcusd: null, ts: null };

async function fetchMarket(force = false) {
  if (!navigator.onLine) { renderMarket(); return; }
  if (!force && S.market?.ts && Date.now() - S.market.ts < 30 * 60 * 1000) { renderMarket(); return; }
  const stEl = document.getElementById("mk-status");
  if (stEl) stEl.textContent = t("mkUpdating");
  const j = u => fetch(u).then(r => r.json());
  const bcbNum = v => Number(String(v?.[0]?.valor ?? "").replace(",", ".")) || null;
  const st = S.settings;
  /* Câmbio só quando existem duas moedas; índices do Brasil só se o Brasil está no jogo */
  const pair = st.hasSecond && secondCur() !== mainCur() ? `${mainCur()}-${secondCur()}` : null;
  const [fx, btc, selic, cdi, ipca] = await Promise.allSettled([
    pair ? j(`https://economia.awesomeapi.com.br/json/last/${pair}`) : Promise.reject(),
    j("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"),
    usesBRL() ? j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json") : Promise.reject(),
    usesBRL() ? j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json") : Promise.reject(),
    usesBRL() ? j("https://api.bcb.gov.br/dados/serie/bcdata.sgs.13522/dados/ultimos/1?formato=json") : Promise.reject(),
  ]);
  const m = { ...(S.market || {}) };
  let ok = false;
  const fxBid = pair && fx.status === "fulfilled" ? Number(fx.value?.[pair.replace("-", "")]?.bid) : 0;
  if (fxBid > 0) { m.fx = fxBid; m.fxPair = pair; ok = true; }
  if (btc.status === "fulfilled" && btc.value?.bitcoin?.usd) { m.btcusd = btc.value.bitcoin.usd; ok = true; }
  if (selic.status === "fulfilled" && bcbNum(selic.value)) { m.selic = bcbNum(selic.value); ok = true; }
  if (cdi.status === "fulfilled" && bcbNum(cdi.value)) { m.cdi = bcbNum(cdi.value); ok = true; }
  if (ipca.status === "fulfilled" && bcbNum(ipca.value)) { m.ipca12 = bcbNum(ipca.value); ok = true; }
  if (ok) {
    m.ts = Date.now();
    S.market = m;
    if (fxBid > 0) S.settings.fx = Math.round(fxBid * 10000) / 10000; // câmbio vivo entra nos cálculos
    save();
    renderAll();

function renderAporte() {

/* ═════════ Plano do mês ═════════
   Transforma os números do mês em passos com valor e destino. É o "direcionamento"
   que faltava: não só onde rende, mas quanto colocar onde, nesta ordem. Substituiu
   o antigo checklist — os itens que o app não consegue verificar sozinho (fatura,
   e a reserva de quem não detalhou a carteira) continuam com marcação manual. */
function renderPlan() {
  const el = document.getElementById("iv-plan");
  if (!el) return;
  const st = S.settings;
  const mk = thisMonth();
  const ms = monthStats(mk);
  const marks = S.checklist[mk] || {};
  const { by, total } = allocation();
  const prev = shiftMonth(mk, -1);
  const lastLivre = monthHasData(prev) ? Math.max(0, monthStats(prev).livre) : 0;

  const spent3 = [1,2,3].map(n => monthStats(shiftMonth(mk, -n)).spent).filter(v => v > 0);
  const avgSpend = spent3.length ? spent3.reduce((a,b) => a+b, 0) / spent3.length : ms.spent;
  const reservaAlvo = avgSpend * 3;                              // moeda principal
  const reservaAtual = conv(by.reserva || 0, wealthCur(), mainCur());
  const faltaReserva = Math.max(0, reservaAlvo - reservaAtual);

  const faltaCompromisso = Math.max(0, st.saveMonthly - ms.savedMain);
  const faltaSegundo = st.hasSecond && st.freePolicy === "main"
    ? Math.max(0, (st.secondMonthly + ms.extrasSecond) - ms.savedSecond) : 0;

  /* Tipo mais abaixo do alvo — para onde vai o excedente */
  const target = RISK_TARGETS[riskProfile()];
  const gaps = ASSET_TYPES.map(ty => ({ ty, gap: (target[ty.id] || 0) - (total > 0 ? (by[ty.id] || 0) / total * 100 : 0) }))
    .filter(g => g.ty.id !== "reserva").sort((a,b) => b.gap - a.gap);
  const alvoTipo = gaps[0];
  const conta = bestAccount();
  const destinoReserva = conta ? conta.name : t("planReserveWhere");

  /* Sem carteira detalhada o app não sabe quanto de reserva existe — aí o passo
     vira uma marcação manual, como era no checklist. */
  const reservaManual = total === 0;
  const steps = [];
  steps.push({ n:1, tt:t("planDebt"), amt:"", why:t("chkCardWhy"), done:!!marks.fatura, chk:"fatura" });
  if (reservaManual) steps.push({ n:steps.length+1, tt:t("chkReserve", fmtM0(reservaAlvo)), amt:"",
    why:t("chkReserveWhy", fmtM0(avgSpend)), done:!!marks.reserva, chk:"reserva" });
  else if (faltaReserva > 1) steps.push({ n:steps.length+1, tt:t("planReserve", destinoReserva), amt:fmtM0(faltaReserva),
    why:t("planReserveWhy", fmtM0(reservaAlvo), fmtM0(avgSpend)), done:false });
  else steps.push({ n:steps.length+1, tt:t("planReserveOk"), amt:fmtM0(reservaAtual), why:t("planReserveOkWhy", fmtM0(reservaAlvo)), done:true });
  if (st.saveMonthly > 0) steps.push(faltaCompromisso > 1
    ? { n:steps.length+1, tt:t("planCommit"), amt:fmtM0(faltaCompromisso), why:t("planCommitWhy", fmtM0(st.saveMonthly), fmtM0(ms.savedMain)), done:false }
    : { n:steps.length+1, tt:t("planCommitOk"), amt:fmtM0(ms.savedMain), why:t("planCommitOkWhy"), done:true });
  if (faltaSegundo > 1) steps.push({ n:steps.length+1, tt:t("planSecond", countryName(st.secondCountry)), amt:fmtS0(faltaSegundo),
    why:t("planSecondWhy", countryName(st.secondCountry)), done:false });
  if (lastLivre > 0) steps.push({ n:steps.length+1, tt:t("planIdle", monthLabel(prev)), amt:fmtM0(lastLivre), why:t("planIdleWhy"), done:false });
  if (total > 0 && alvoTipo && alvoTipo.gap > 1) steps.push({ n:steps.length+1, tt:t("planRebalance", L(alvoTipo.ty.label)),
    amt:"", why:t("planRebalanceWhy", riskLabel(), Math.round(alvoTipo.gap)), done:false });

  /* Renumera depois de saber quais passos existem */
  let i = 0;
  el.innerHTML = `<div class="steps">` + steps.map(s => {
    if (!s.done && !s.chk) i++;   // itens de marcar não consomem número
    const marca = s.chk
      ? `<label class="n" style="cursor:pointer; padding:0"><input type="checkbox" ${s.done ? "checked" : ""} style="width:16px; height:16px; margin:0"
           onchange="toggleChk('${s.chk}', this.checked)" aria-label="${esc(s.tt)}"></label>`
      : `<span class="n">${s.done ? "✓" : i}</span>`;
    return `<div class="step ${s.done ? "done" : ""}">
      ${marca}
      <div style="flex:1"><b>${s.tt}</b><div class="why">${s.why}</div></div>
      ${s.amt ? `<span class="amt">${s.amt}</span>` : ""}
    </div>`;
  }).join("") + `</div>
    <div class="hint">${t("planHint")}</div>`;
}
const riskLabel = () => t("wsRisk_" + riskProfile());

/* Marcações manuais do plano (fatura paga, reserva de quem não detalhou a carteira).
   Ficam por mês: em setembro a fatura de agosto não conta. */
function toggleChk(id, v) {
  const mk = thisMonth();
  if (!S.checklist[mk]) S.checklist[mk] = {};
  S.checklist[mk][id] = v;
  save(); renderPlan();
}

let repMonth = null;
function moveRep(n) { repMonth = shiftMonth(repMonth || thisMonth(), n); renderRelatorio(); }
function renderRelatorio() {
  const el = document.getElementById("rep-resumo");
  if (!el) return;
  const mk = repMonth || thisMonth();
  const ms = monthStats(mk);
  document.getElementById("rep-title").textContent = monthLabel(mk);

  const taxaPoup = ms.ganho > 0 ? Math.max(0, (ms.ganho - ms.spent) / ms.ganho * 100) : 0;
  el.innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repEarnedUS")}</td><td class="num">${fmtM(ms.ganho)}</td></tr>
    ${ms.rendaSecond > 0 && S.settings.freePolicy === "main" ? `<tr><td>${t("repEarnedBR")}</td><td class="num">${fmtS0(ms.rendaSecond)}</td></tr>` : ""}
    <tr><td>${t("repSpentOwn")}</td><td class="num">${fmtM(ms.spent)}</td></tr>
    ${ms.spentSecond > 0 ? `<tr><td>${t("repSpentSecond")}</td><td class="num">${fmtS0(ms.spentSecond)}</td></tr>` : ""}
    ${ms.covered > 0 ? `<tr><td>${t("repCovered")}</td><td class="num">${fmtM(ms.covered)}</td></tr>` : ""}
    <tr><td>${t("repSavedUS")}</td><td class="num">${fmtM(ms.savedMain)}</td></tr>
    ${ms.savedSecond > 0 ? `<tr><td>${t("repSavedBR")}</td><td class="num">${fmtS0(ms.savedSecond)}</td></tr>` : ""}
    <tr><td><b>${t("repFree")}</b></td><td class="num"><b class="${ms.livre >= 0 ? "pos" : "neg"}">${fmtM(ms.livre)}</b></td></tr>
    <tr><td>${t("repRate")}</td><td class="num">${taxaPoup.toFixed(0)}%</td></tr>
  </tbody></table>`;

  const byCat = {}, byCatPrev = {};
  const soMain = e => counts(e) && expBucket(e) === "main";
  S.expenses.filter(e => monthKey(e.date) === mk && soMain(e))
    .forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + conv(e.amount, expCur(e), mainCur()));
  S.expenses.filter(e => monthKey(e.date) === shiftMonth(mk, -1) && soMain(e))
    .forEach(e => byCatPrev[e.cat] = (byCatPrev[e.cat] || 0) + conv(e.amount, expCur(e), mainCur()));
  const rows = allCats().filter(c => byCat[c.id] || byCatPrev[c.id]).sort((a, b) => (byCat[b.id] || 0) - (byCat[a.id] || 0));
  document.getElementById("rep-cats").innerHTML = rows.length === 0
    ? `<div class="empty">${t("repNoExp")}</div>`
    : `<table class="rep"><tbody>` + rows.map(c => {
        const now = byCat[c.id] || 0, was = byCatPrev[c.id] || 0, d = now - was;
        const delta = was === 0 && now === 0 ? "" : d === 0 ? "=" :
          `<span class="${d > 0 ? "neg" : "pos"}">${d > 0 ? "▲" : "▼"} ${fmtM0(Math.abs(d))}</span>`;
        return `<tr><td><span class="dot" style="background:var(${c.color})"></span>${L(c.label)}</td>
          <td class="num">${fmtM0(now)}</td><td class="num" style="font-size:12px">${delta}</td></tr>`;
      }).join("") + `</tbody></table><div class="hint">${t("repDeltaHint")}</div>`;

  /* Patrimônio & meta */
  const st = S.settings;
  const inv = invested();
  const falta = Math.max(0, st.goalAmount - inv);
  const fdm = firstDataMonth();
  const [fy, fm] = fdm.split("-").map(Number);
  const [cy, cm] = thisMonth().split("-").map(Number);
  const span = Math.max(1, Math.min(3, (cy - fy) * 12 + (cm - fm) + 1));
  const savedInWealth = s => toWealth(s.savedMain, mainCur()) + toWealth(s.savedSecond, secondCur());
  const media3 = [...Array(span)].map((_, n) => savedInWealth(monthStats(shiftMonth(thisMonth(), -n))));
  const mediaW = media3.reduce((a, b) => a + b, 0) / span;
  let proj = "";
  if (falta <= 0 && st.goalAmount > 0) proj = `<span class="badge covered">${t("bdgGoalDone")}</span>`;
  else if (mediaW > 0) {
    const meses = Math.ceil(falta / mediaW);
    const dataEst = shiftMonth(thisMonth(), meses);
    const alvoOk = st.goalMonth && dataEst <= st.goalMonth;
    proj = t("repProj", fmtW0(mediaW), monthLabel(dataEst)) + " " +
      (st.goalMonth ? (alvoOk ? `<span class="badge covered">${t("repBefore")}</span>` : `<span class="badge warn">${t("repAfter", monthLabel(st.goalMonth))}</span>`) : "");
  } else proj = t("repProjNone");
  document.getElementById("rep-meta").innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repInvested")}</td><td class="num">${fmtW0(inv)}</td></tr>
    <tr><td>${t("repGoal")}</td><td class="num">${fmtW0(st.goalAmount)}${st.goalMonth ? " · " + monthLabel(st.goalMonth) : ""}</td></tr>
    <tr><td>${t("repMissing")}</td><td class="num">${fmtW0(falta)}</td></tr>
    <tr><td>${t("repMonthContrib")}</td><td class="num">${fmtW0(savedInWealth(ms))}</td></tr>
  </tbody></table><div style="font-size:13px; margin-top:8px">${proj}</div>`;

  /* Ano até aqui */
  const year = mk.slice(0, 4);
  const yms = [];
  const dataStart = firstDataMonth();
  for (let m = 1; m <= 12; m++) { const k = `${year}-${String(m).padStart(2, "0")}`; if (k <= mk && k >= dataStart) yms.push(k); }
  const tot = yms.reduce((acc, k) => {
    const s = monthStats(k);
    acc.ganho += s.ganho; acc.gasto += s.spent; acc.coberto += s.covered;
    acc.aporte += savedInWealth(s); acc.sec += s.rendaSecond;
    return acc;
  }, { ganho: 0, gasto: 0, coberto: 0, aporte: 0, sec: 0 });
  document.getElementById("rep-ytd").innerHTML = `<table class="rep"><tbody>
    <tr><td>${t("repYEarnedUS")}</td><td class="num">${fmtM(tot.ganho)}</td></tr>
    ${tot.sec > 0 && st.freePolicy === "main" ? `<tr><td>${t("repYEarnedBR")}</td><td class="num">${fmtS0(tot.sec)}</td></tr>` : ""}
    <tr><td>${t("repYSpent")}</td><td class="num">${fmtM(tot.gasto)}</td></tr>
    ${tot.coberto > 0 ? `<tr><td>${t("repYCovered")}</td><td class="num">${fmtM(tot.coberto)}</td></tr>` : ""}
    <tr><td><b>${t("repYSaved")}</b></td><td class="num"><b>${fmtW0(tot.aporte)}</b></td></tr>
  </tbody></table>
  <div class="hint">${t("repYtdHint", year, monthLabel(mk))}</div>`;

  renderPanorama();
}

  sbUser = null; renderAuthUI();
}
function authSkip() {
  localStorage.setItem("mf-skip-login", "1");
  document.getElementById("auth").classList.remove("on");
  wizardIfNeeded();
}
function authOpen() {
  localStorage.removeItem("mf-skip-login");
  authErr("");
  document.getElementById("auth").classList.add("on");
}
function authErr(msg) { document.getElementById("au-err").textContent = msg; }
function traduzErro(m) {
  if (/invalid login/i.test(m)) return t("errBadLogin");
  if (/already registered/i.test(m)) return t("errExists");
  if (/rate limit/i.test(m)) return t("errRate");
  if (/valid email/i.test(m)) return t("errEmail");
  return m;
}

/* Sync: pull no login/abertura, push (debounced) a cada save */
async function firstSync() {
  if (!sb || !sbUser) return;
  /* Beta: uma única leitura da nuvem, só enquanto não houver dados próprios */
  if (BETA && localStorage.getItem(BETA_SEED)) { wizardIfNeeded(); renderAuthUI(); return; }
  try {
    const { data, error } = await sb.from("app_state").select("data, updated_at").eq("user_id", sbUser.id).maybeSingle();
    if (error) throw error;
    const localTs = S._ts || 0;
    const localHasData = S.settings.onboarded || S.expenses.length || S.contributions.length;
    if (!data) {
      if (localHasData) await sbPushNow();      // primeiro aparelho: sobe o que já existe
    } else {
      const remoteTs = data.data?._ts || new Date(data.updated_at).getTime();
      if (remoteTs > localTs || !localHasData) {
        S = migrate(data.data);
        localStorage.setItem(KEY, JSON.stringify(S));
        _fmtCache.clear();
        if (S.settings.lang && S.settings.lang !== lang) { lang = S.settings.lang; }
        applyLang();
      } else if (localTs > remoteTs) await sbPushNow();
    }
    if (BETA) localStorage.setItem(BETA_SEED, "1");
  } catch (e) { console.warn("sync pull falhou:", e.message); }
  wizardIfNeeded();   // já configurado na nuvem? fecha o wizard; conta nova? abre
  renderAuthUI();
}
function sbQueuePush() {
  if (!sb || !sbUser) return;
  clearTimeout(sbPushTimer);
  sbPushTimer = setTimeout(sbPushNow, 1500);
}
async function sbPushNow() {
  if (BETA) return;              // beta nunca sobe: o app principal manda na nuvem
  if (!sb || !sbUser) return;
  try {
    const { error } = await sb.from("app_state").upsert({
      user_id: sbUser.id, data: S, updated_at: new Date().toISOString(),
    });
    if (error) throw error;
    sbLastPush = Date.now();
    renderAuthUI();
  } catch (e) { console.warn("sync push falhou:", e.message); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sbUser) firstSync();
});

function renderAuthUI() {
  const badge = document.getElementById("sync-badge");
  const cfg = document.getElementById("cfg-account");
  if (!sbConfigured()) {
    badge.innerHTML = "";
    if (cfg) cfg.innerHTML = `<div class="hint" style="margin:0">${t("cfgDataHint")}</div>`;
    return;
  }
  if (sbUser) {
    badge.innerHTML = BETA ? t("betaSync")
      : sbLastPush ? t("syncOk", new Date(sbLastPush).toLocaleTimeString(dloc(), { hour: "2-digit", minute: "2-digit" })) : t("syncOn");
    if (cfg) cfg.innerHTML = `
      <div style="font-size:13.5px">${t("cfgConnected", esc(sbUser.email))}</div>
      <button class="btn ghost" style="margin-top:10px" onclick="sbLogout()">${t("cfgLogout")}</button>`;
  } else {
    badge.innerHTML = `<button onclick="authOpen()">${t("syncEnter")}</button>`;
    if (cfg) cfg.innerHTML = `
      <div style="font-size:13.5px">${t("cfgNoAccount")}</div>
      <button class="btn" style="margin-top:10px" onclick="authOpen()">${t("cfgEnter")}</button>`;
  }
}


/* ═════════ Viagens e temporadas fora ═════════
   Uma viagem tem destino, moeda, datas e orçamento. Enquanto ela está aberta,
   os gastos dela vivem no orçamento dela e o mês de casa não se assusta; ao
   encerrar, tudo entra no painel principal, nos meses em que aconteceu.
   Temporada longa (o assignment de dois anos, por exemplo) é vida normal:
   conta no painel desde o primeiro dia, e o orçamento é por mês. */
const dayDiff = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const lastDayOf = mk => { const [y, m] = mk.split("-").map(Number); return `${mk}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`; };
const tripIsLong = tp => tp.kind === "long";
/* Temporada longa é morar lá, não viajar: ela leva a bandeira do país */
const tripIcon = tp => tripIsLong(tp) ? flagOf(tp.country) : "✈️";
const fmtT = (tp, v) => fmtCur(v, tp.cur, 0);
/* A temporada longa mede o mês corrente; a viagem mede o período dela */
function tripWindow(tp) {
  if (tripIsLong(tp)) { const mk = thisMonth(); return { from: mk + "-01", to: lastDayOf(mk) }; }
  return { from: tp.start || "", to: tp.end || "" };
}
function tripStats(tp) {
  const w = tripWindow(tp);
  const exps = S.expenses.filter(e => String(e.place) === String(tp.id)).sort((a, b) => b.date.localeCompare(a.date));
  const win = exps.filter(e => (!w.from || e.date >= w.from) && (!w.to || e.date <= w.to));
  /* A viagem cobre tudo que você marcou como dela — inclusive a passagem comprada
     antes de embarcar. Só a temporada longa mede um mês de cada vez. */
  const conta = tripIsLong(tp) ? win : exps;
  let spent = 0, covered = 0;
  conta.forEach(e => {
    const v = conv(e.amount, expCur(e), tp.cur);
    if (reimbursed(e)) covered += v; else spent += v;
  });
  const base = conv(tp.budget, tp.budgetCur, tp.cur);
  const extra = (tp.topups || []).reduce((acc, x) => acc + conv(x.amount, x.cur || tp.budgetCur, tp.cur), 0);
  const budget = base + extra;
  const left = budget - spent;
  const hoje = todayStr();
  const started = !w.from || w.from <= hoje;
  const ended = !!w.to && w.to < hoje;
  const totalDays = w.from && w.to ? Math.max(1, dayDiff(w.from, w.to) + 1) : 0;
  const dayNo = w.from && totalDays ? Math.min(totalDays, Math.max(1, dayDiff(w.from, hoje) + 1)) : 0;
  const daysLeft = w.to && !ended && started ? dayDiff(hoje, w.to) + 1 : 0;
  return { exps, win, conta, spent, covered, base, extra, budget, left, started, ended,
           totalDays, dayNo, daysLeft, perDay: daysLeft > 0 ? left / daysLeft : 0 };
}
function tripBadge(tp) {
  if (tp.closed) return `<span class="badge covered">${t("tripClosedBadge")}</span>`;
  if (tripIsLong(tp)) return `<span class="badge counts">${t("tripLong")}</span>`;
  const hoje = todayStr();
  if (tp.start && tp.start > hoje) return `<span class="badge warn">${t("tripSoon", dayDiff(hoje, tp.start))}</span>`;
  if (tp.end && tp.end < hoje) return `<span class="badge crit">${t("tripOver")}</span>`;
  return `<span class="badge counts">${t("tripOngoing")}</span>`;
}
/* Qual viagem merece espaço no Início: a que está acontecendo; senão a que
   terminou e ainda não foi encerrada; senão a que começa nos próximos 30 dias. */
function featuredTrip() {
  const hoje = todayStr();
  const abertas = (S.trips || []).filter(tp => !tp.closed);
  const agora = abertas.filter(tp => (!tp.start || tp.start <= hoje) && (!tp.end || tp.end >= hoje));
  if (agora.length) return agora.sort((a, b) => (a.end || "9999").localeCompare(b.end || "9999"))[0];
  const fim = abertas.filter(tp => tp.end && tp.end < hoje).sort((a, b) => b.end.localeCompare(a.end));
  if (fim.length) return fim[0];
  return abertas.filter(tp => tp.start && tp.start > hoje && dayDiff(hoje, tp.start) <= 30)
    .sort((a, b) => a.start.localeCompare(b.start))[0] || null;
}
function renderTripCard() {
  const el = document.getElementById("trip-card");
  if (!el) return;
  const tp = featuredTrip();
  el.innerHTML = tp ? tripCardHTML(tp) : "";
}
/* O mesmo cartão serve o Início (quando há viagem em curso) e a aba Viagens */
function tripCardHTML(tp) {
  const st = tripStats(tp);
  const pct = st.budget > 0 ? Math.min(100, st.spent / st.budget * 100) : 0;
  const alsoM = tp.cur === mainCur() ? "" : ` · ≈ ${fmtM0(conv(st.left, tp.cur, mainCur()))}`;
  const sub =
    !st.started ? t("tripBeforeStart") :
    st.ended ? t("tripAfterEnd") :
    st.daysLeft > 1 ? t("tripPerDay", fmtT(tp, st.perDay), st.daysLeft) :
    st.daysLeft === 1 ? t("tripLastDay", fmtT(tp, st.left)) : "";
  return `<div class="card trip">
    <div class="thead">
      <span class="tname">${tripIcon(tp)} ${esc(tripName(tp))}</span>${tripBadge(tp)}
      <span style="flex:1"></span>
      <span class="hint" style="margin:0">${tripIsLong(tp) ? monthLabel(thisMonth()) : (tp.start ? t("tripPeriod", fmtD(parseDate(tp.start)), tp.end ? fmtD(parseDate(tp.end)) : "—") : "")}${st.totalDays && st.started && !st.ended ? " · " + t("tripDayOf", st.dayNo, st.totalDays) : ""}</span>
    </div>
    <div class="label" style="font-size:12.5px; color:var(--ink-2)">${t("tripAvail")}</div>
    <div class="tbig ${st.left < 0 ? "neg" : ""}">${fmtT(tp, st.left)}</div>
    <div class="tsub">${sub}${alsoM}</div>
    <div class="meter ${st.spent > st.budget ? "over" : ""}"><div style="width:${pct}%"></div></div>
    <div class="tsub">${t("tripSpentOf", fmtT(tp, st.spent), fmtT(tp, st.budget))}${st.covered > 0 ? " · " + t("tripCovered", fmtT(tp, st.covered)) : ""}</div>
    <div class="tacts">
      <button class="btn" onclick="goLanc('${tp.id}')">${t("btnAdd")} ${t("wordExpense")}</button>
      <button class="btn ghost" onclick="openSheet('trip','${tp.id}')">${t("tripOpenSheet")}</button>
      ${st.ended && !tripIsLong(tp) ? `<button class="btn ghost" onclick="closeTrip('${tp.id}')">${t("tripEndBtn")}</button>` : ""}
    </div>
  </div>`;
}
/* Folha da viagem: o orçamento inteiro, os reforços e cada gasto */

      </div>

      <div class="tbig ${st.left < 0 ? "neg" : ""}" style="font-size:30px; font-weight:650">${fmtT(tp, st.left)}</div>

        ${tp.cur !== mainCur() ? " · ≈ " + fmtM0(conv(st.left, tp.cur, mainCur())) : ""}</div>
      <div class="meter ${st.spent > st.budget ? "over" : ""}" style="margin-top:12px"><div style="width:${st.budget > 0 ? Math.min(100, st.spent / st.budget * 100) : 0}%"></div></div>
      <table style="margin-top:10px"><tbody>
        ${linha(t("tripBudget"), fmtT(tp, st.budget))}
        ${linha(t("thSpentC"), fmtT(tp, st.spent))}
        ${st.covered > 0 ? linha(t("repCovered"), fmtT(tp, st.covered)) : ""}
        ${tp.goal > 0 ? linha(t("tripGoal"), fmtT(tp, conv(tp.goal, tp.budgetCur, tp.cur))) : ""}
      </tbody></table>
      ${st.extra > 0 ? `<div class="hint">${t("tripBudgetLine", fmtT(tp, st.base), fmtT(tp, st.extra), fmtT(tp, st.budget))}</div>` : ""}
      ${tp.closed ? "" : `<form class="inline" style="margin-top:12px" onsubmit="return addTripBudget(event,'${tp.id}')">
        <div class="field"><label>${t("tripAddBudget")} (${curSym(tp.budgetCur)})</label>

        <button class="btn" type="submit">${t("btnAdd")}</button>
      </form>`}
      ${topups.length ? `<div class="hint" style="margin-top:10px">${t("tripTopups")}</div>
        <table><tbody>${topups.map(x => `<tr><td>${fmtD(parseDate(x.date))} ${esc(x.why || "")}</td>
          <td class="num">+ ${fmtCur(x.amount, x.cur || tp.budgetCur, 0)}</td>
          <td style="width:30px"><button class="mini" onclick="delTopup('${tp.id}','${x.id}')" title="${t("del")}">✕</button></td></tr>`).join("")}</tbody></table>` : ""}
    </div>

    <div class="card">
      <h2>${t("tripExpenses")}</h2>
      ${st.conta.length === 0 ? `<div class="empty">${t("tripNoExp")}</div>` : `<table><tbody>
        ${st.conta.map(e => {
          const c = catById(e.cat);
          return `<tr><td>${fmtD(parseDate(e.date))}</td>
            <td><span class="dot" style="background:var(${c.color})"></span>${esc(L(c.label))}${e.desc ? " · " + esc(e.desc) : ""}
              ${reimbursed(e) ? `<span class="badge covered">${t("bdgCovered")}</span>` : ""}</td>
            <td class="num">${fmtCur(e.amount, expCur(e), 2)}</td>
            <td style="width:30px"><button class="mini" onclick="delLanc('gasto','${e.id}')" title="${t("del")}">✕</button></td></tr>`;
        }).join("")}</tbody></table>`}
      ${tp.closed ? "" : `<button class="btn" style="margin-top:12px" onclick="goLanc('${tp.id}')">${t("btnAdd")} ${t("wordExpense")}</button>`}
    </div>

    <div class="card">

      <div class="chiprow" style="margin-top:12px">
        ${tp.closed
          ? `<button class="btn ghost" onclick="reopenTrip('${tp.id}')">${t("tripReopen")}</button>`

        <button class="btn ghost" onclick="delTrip('${tp.id}')">${t("tripDelBtn")}</button>
